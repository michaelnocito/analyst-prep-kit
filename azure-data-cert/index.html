<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DP-900 Azure Data Fundamentals Prep · Analyst Prep Kit</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/azure-data-cert/">
<meta name="description" content="Prep for Microsoft DP-900 Azure Data Fundamentals. An area-by-area study guide of core data concepts, the Azure SQL family, Cosmos DB and Azure Storage, and the analytics stack (Fabric, Databricks, Power BI), plus a 48-question practice exam weighted like the official skills outline.">
<link rel="stylesheet" href="../assets/grain/grain.css">
<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Small inline viz helpers */
.vz-chip{padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border);font-size:12px;white-space:nowrap}
.vz-arrow{color:var(--dim);font-size:12px}
.vz-card{border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);font-size:13px}
.vz-card b{display:block}
.vz-card span{color:var(--dim);font-size:12px}
.vz-note{color:var(--dim);font-size:12px;margin-top:7px}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>
</head>
<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Back to all kits">← All Kits</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>DP-900 Azure Data Fundamentals Prep</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>
  <button class="nav-btn" id="navStudy" onclick="setView('study')">Study Guide</button>
  <button class="nav-btn" id="navExam" onclick="setView('exam')">Practice Exam</button>
  <button class="nav-btn" id="navResults" onclick="setView('results')" style="display:none">Results</button>
  <div class="nav-spacer"></div>
  <button class="nav-btn" onclick="resetAll()" title="Reset progress"><i data-lucide="rotate-ccw"></i>Reset</button>
  <button class="nav-btn" onclick="toggleTheme()"><span id="themeIcon"><i data-lucide="sun"></i></span></button>

<script>

state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? 'Key saved. Hints are on.' : 'Key cleared.');
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = 'Add your Anthropic API key on the home page under Hints to turn hints on.'; return; }
  el.textContent = 'Thinking…';
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || 'Request refused. Check your key.'; return; }
    el.textContent = data.content?.[0]?.text || 'No response. Check your key.';
  } catch(e){ el.textContent = 'Request failed. Check your key and your connection.'; }
}
const TUTOR_ROLE = `You are a plain-spoken Azure data tutor helping a new data analyst study for Microsoft exam DP-900, Azure Data Fundamentals. That exam covers core data concepts (structured, semi-structured and unstructured data, file formats, transactional vs analytical workloads, data roles), relational data on Azure (normalization, SQL statement types, database objects, the Azure SQL family, Azure Database for MySQL and PostgreSQL), non-relational data on Azure (Blob, Files and Table storage, Azure Cosmos DB and its APIs), and analytics workloads on Azure (ingestion, data warehouses, lakes and lakehouses, Microsoft Fabric, Azure Databricks, batch vs streaming, Power BI). Use facts from Microsoft Learn only.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what the exam is likely to ask about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : '(no answer)');
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

      docPath:'https://learn.microsoft.com/en-us/training/modules/explore-provision-deploy-relational-database-offerings-azure/',
      docLabel:'Explore relational database services in Azure (Microsoft Learn)'},
  d3:{label:'Area 3', name:'Non-relational data on Azure', weight:19, range:'15 to 20%', color:'var(--c-d3)',
      hint:'Blob types and access tiers, Data Lake Storage Gen2, Azure Files, Azure Table storage, Cosmos DB and its five APIs.',
      docPath:'https://learn.microsoft.com/en-us/training/modules/explore-non-relational-data-stores-azure/',

};
const DOMAIN_ORDER = ['d1','d2','d3','d4'];

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:'Core data concepts: shapes of data, stores, workloads, roles',
    must:[
      `<strong>Three shapes of data, and the test is the schema.</strong> <em>Structured</em> data follows a fixed schema, so every record has the same fields. Think of a spreadsheet where every row has the same columns. It is usually tabular and lives in relational tables.`,
      `<strong>Semi-structured data has some structure but allows variation</strong> between records. One customer has two email addresses, another has none. JSON is the common example. The shape bends per record, which a fixed table cannot do.`,
      `<strong>Unstructured data has no specific structure at all.</strong> Documents, images, audio, video and binary files. Microsoft Learn also now mentions <em>vector data</em> (embeddings) as a growing type used by AI assistants.`,
      `<strong>Two broad categories of data store: file stores and databases.</strong> Files sit in a file system or cloud storage. A database is a dedicated system for managing data records rather than files.`,
      `<strong>Delimited text (CSV, TSV, fixed width) is the human-readable choice</strong> for structured data that many applications need to read. Fields split on a comma or tab, rows end on a new line, and the first line may carry field names.`,
      `<strong>JSON uses braces for objects and square brackets for collections.</strong> It fits both structured and semi-structured data because an attribute can itself be an object or a list. XML does a similar job with angle-bracket tags but is more verbose and mostly superseded.`,
      `<strong>Parquet is columnar, Avro is row-based.</strong> Parquet stores each column together inside row groups with metadata, which is why it is the de facto standard for lakehouses and great for analytics. Avro stores a JSON header plus binary blocks of whole records, good for compression and moving data over the network.`,
      `<strong>Delta Lake is Parquet plus a transaction log.</strong> The log adds ACID transactions, versioning and reliable updates on top of files in a data lake. Both Microsoft Fabric and Azure Databricks use it as their standard format.`,
      `<strong>BLOB means Binary Large Object</strong>: raw binary that an application must interpret, such as images, video, audio and application-specific documents. It is the file-side word for unstructured data.`,
      `<strong>Relational databases store structured data in tables with primary keys.</strong> A key uniquely identifies each row and is referenced from other tables, which lets the database be normalized so each fact is stored once. SQL, based on an ANSI standard, queries them.`,
      `<strong>Four kinds of non-relational (NoSQL) database.</strong> <em>Key-value</em>: a unique key and a value of any format. <em>Document</em>: a key-value store where the value is a JSON document. <em>Column family</em>: rows and columns, with columns grouped into families. <em>Graph</em>: entities as nodes with links as relationships.`,
      `<strong>OLTP is the live system that records transactions</strong>: a bank transfer, a checkout. It is high volume, optimized for both reads and writes, and built around CRUD operations (create, retrieve, update, delete). These systems run line-of-business (LOB) applications.`,
      `<strong>ACID is the promise an OLTP transaction makes.</strong> <em>Atomicity</em>: all or nothing. <em>Consistency</em>: one valid state to another. <em>Isolation</em>: concurrent transactions do not interfere. <em>Durability</em>: once committed, it stays committed even if the power goes out.`,
      `<strong>Analytical processing is read-only or read-mostly</strong> over large volumes of historical data or snapshots. The common pipeline: ETL or ELT into a data lake, load into a lakehouse or warehouse, aggregate into an OLAP or semantic model, then report on it.`,
      `<strong>A data lake is files, a data warehouse is relational, a lakehouse is both.</strong> Lakes collect large volumes of file-based data. Warehouses hold a relational schema optimized for reads. Lakehouses put relational querying on top of lake storage.`,
      `<strong>An OLAP model (now usually called a semantic model, historically a cube) pre-aggregates measures across dimensions</strong> so you can drill up and down, for example sales by region, then city, then address. Because the numbers are aggregated, summary queries are fast.`,
      `<strong>Who works where</strong>: data scientists work with raw files in the data lake, data analysts query tables in the warehouse, business users consume the pre-aggregated model as reports and dashboards.`,
      `<strong>Three roles, three sentences.</strong> A <em>database administrator</em> manages databases: availability, performance, backups, restores, and who has access. A <em>data engineer</em> builds and monitors the pipelines that ingest, clean and move data between systems. A <em>data analyst</em> explores data, builds models, and turns it into reports and visualizations for decisions.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Semi-structured just means messy." It means the structure is allowed to vary per record, not that there is none. A JSON document with nested objects is highly organized, but two documents in the same collection can carry different fields. If a question describes records with different numbers of phone numbers, or fields that only some records have, that is semi-structured, not unstructured. Unstructured is reserved for things like images and audio where there is no field structure to speak of.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:stretch">
      <div class="vz-card" style="flex:1;min-width:160px"><b>Structured</b><span>Fixed schema, tables. CSV, SQL tables.</span></div>
      <div class="vz-card" style="flex:1;min-width:160px"><b>Semi-structured</b><span>Some structure, varies per record. JSON, XML.</span></div>
      <div class="vz-card" style="flex:1;min-width:160px"><b>Unstructured</b><span>No field structure. Images, audio, video, PDFs.</span></div>
    </div><div class="vz-note">Ask "does every record have the same fields?" Yes means structured. Mostly means semi-structured. The question does not apply means unstructured.</div>`},

  {key:'d2', title:'Relational data on Azure: normalization, SQL, objects, the Azure SQL family',
    must:[
      `<strong>A relational table models one entity.</strong> Each row is one instance (one customer, one order). Each column is one attribute with a set data type. A column can be NULL when the value is missing, unless it is declared NOT NULL.`,
      `<strong>Normalization in four steps</strong>, per Microsoft Learn: separate each entity into its own table, separate each attribute into its own column, identify each row with a primary key, and link related entities with foreign keys.`,
      `<strong>Why normalize: less duplication and better integrity.</strong> A customer's address is stored once, so changing it means changing one row. Each column holds one data type, so prices must be decimals and quantities must be integers.`,
      `<strong>A foreign key points at another table's primary key</strong>, and the database can enforce referential integrity: no order for a customer who does not exist. A key built from several columns together is a <em>composite</em> key.`,
      `<strong>DDL defines structure</strong>: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>RENAME</code>. Dropping a table loses all its rows. DDL is about the shape of objects, not the rows inside them.`,
      `<strong>DCL controls access</strong>: <code>GRANT</code>, <code>DENY</code>, <code>REVOKE</code>. It is the administrator's group. Revoke removes a permission you granted earlier; deny blocks it outright.`,
      `<strong>DML manipulates rows</strong>: <code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>. An UPDATE or DELETE with no WHERE clause touches every row, and SQL never asks "are you sure".`,
      `<strong>Three dialects to recognize.</strong> Transact-SQL (T-SQL) for SQL Server and the Azure SQL family. pgSQL for PostgreSQL. PL/SQL for Oracle. SQL was standardized by ANSI in 1986 and ISO in 1987; vendors add their own extensions on top.`,
      `<strong>A view is a virtual table based on a SELECT query.</strong> It is a saved window onto one or more tables, queried and filtered like a table. It does not copy the data.`,
      `<strong>A stored procedure is saved SQL you run on command</strong>, often with parameters, to encapsulate logic the application needs. You call it with EXEC and pass in values.`,
      `<strong>An index is like the index at the back of a book.</strong> A sorted copy of one column with pointers to rows, so a WHERE on that column finds rows without scanning the whole table. It costs storage and slows inserts, updates and deletes, because it has to be maintained.`,
      `<strong>Azure SQL is a family of three</strong> based on the SQL Server engine. <em>SQL Server on Azure VMs</em> is IaaS. <em>Azure SQL Managed Instance</em> is PaaS. <em>Azure SQL Database</em> is PaaS. The ladder runs from most control to least admin work.`,
      `<strong>SQL Server on Azure VMs is the lift-and-shift option</strong>: fully compatible with on-premises, you manage the operating system, patches, backups and everything else. Pick it when you need OS-level access or full control. Availability 99.99%.`,
      `<strong>Azure SQL Managed Instance has near-100% SQL Server compatibility</strong> with automated updates, backups and recovery. Use it for most cloud migrations when you want minimal application changes. Each instance can host multiple databases; instance pools share resources. Availability 99.99%.`,
      `<strong>Azure SQL Database is for new cloud applications.</strong> It supports most core database-level features, but some instance-level features are missing. Two shapes: a <em>single database</em> on a logical server, or an <em>elastic pool</em> where several databases share memory, storage and compute. Availability 99.995%.`,
      `<strong>Serverless and Hyperscale are Azure SQL Database options.</strong> Serverless scales compute automatically and you pay per use. Hyperscale supports very large databases, up to 100 TB, with fast backup and restore regardless of size.`,
      `<strong>Azure Database for MySQL is PaaS on MySQL Community Edition</strong>, the classic choice for LAMP-stack apps. Automatic backups with point-in-time restore up to 35 days (7 by default). Flexible Server is the recommended deployment option for new workloads.`,
      `<strong>Azure Database for PostgreSQL is PaaS PostgreSQL</strong>, a hybrid relational-object database that can store custom data types and geometric data, extended with code modules. Its dialect is pgsql. Query history lives in the <code>azure_sys</code> database, seen through <code>query_store.qs_view</code>. Flexible Server is the current deployment option.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Managed Instance and SQL Database are the same thing with different names." They are both PaaS, but the exam lives in the gap. Managed Instance gives you a whole SQL Server <em>instance</em> in the cloud with near-100% compatibility, which is why it is the migration answer. SQL Database gives you a <em>database</em> with the core features and the highest availability number, which is why it is the new-cloud-app answer. If the question says "minimal changes to an existing on-premises solution", reach for Managed Instance. If it says "new application" or "elastic pool", reach for SQL Database.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="vz-chip"><b>SQL Server on Azure VM</b><br><span style="color:var(--dim)">IaaS · you manage OS · lift and shift</span></span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Azure SQL Managed Instance</b><br><span style="color:var(--dim)">PaaS · near-100% compatible · migrations</span></span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Azure SQL Database</b><br><span style="color:var(--dim)">PaaS · new cloud apps · 99.995%</span></span>
    </div><div class="vz-note">Left to right: more control and more admin work, to less of both. The exam asks which rung fits a scenario.</div>`},

  {key:'d3', title:'Non-relational data on Azure: Storage, Data Lake, Files, Tables, Cosmos DB',
    must:[
      `<strong>Azure Storage is one account, three kinds of store.</strong> <em>Blob containers</em> for binary files at scale, <em>file shares</em> like a corporate network drive, and <em>tables</em> for key-value data. A storage account can hold all three.`,
      `<strong>Blobs live in containers, and access is controlled at the container level.</strong> Folders inside a container are virtual by default: just a <code>/</code> in the blob name. Microsoft Entra ID with Azure RBAC is the recommended way to sign in and assign permissions.`,
      `<strong>Three blob types.</strong> <em>Block blobs</em> for large discrete objects that change rarely (blocks up to 4,000 MiB, blob up to 190.7 TiB). <em>Page blobs</em> for random read and write in 512-byte pages, up to 8 TB, used for VM virtual disks. <em>Append blobs</em> for adding to the end only, just over 195 GB maximum, think logs.`,
      `<strong>Four access tiers: Hot, Cool, Cold, Archive.</strong> Storage cost falls and access cost rises as you go down. Hot is the default. Minimum stays to avoid early-deletion charges: Cool 30 days, Cold 90 days, Archive 180 days.`,
      `<strong>Archive is offline.</strong> Reads from Hot, Cool and Cold take milliseconds. An Archive blob can take up to 15 hours to become available, and you must move it to Hot, Cool or Cold first, a step called <em>rehydration</em>. You cannot read it where it sits.`,
      `<strong>Lifecycle management policies move blobs down the tiers automatically</strong> as they age, based on days since modification, and can delete old blobs. That is how you avoid paying Hot prices for data nobody reads.`,
      `<strong>Redundancy options in plain terms.</strong> LRS keeps three copies in one datacenter. ZRS spreads copies across three availability zones in the region. GRS and GZRS also copy asynchronously to a second region far away. RA-GRS and RA-GZRS let you read from that second region before any failover.`,
      `<strong>Azure Data Lake Storage Gen2 is Blob Storage with a hierarchical namespace.</strong> Real folders, not virtual ones, with POSIX-style access control lists on files and folders. It is compatible with Hadoop-style distributed file systems, which is what Spark and Databricks expect.`,
      `<strong>You get Data Lake Storage Gen2 by enabling Hierarchical Namespace</strong> on a storage account, at creation or as an upgrade later. The upgrade is one-way. You cannot go back to a flat namespace.`,
      `<strong>OneLake is the Fabric data lake, built on Data Lake Storage Gen2.</strong> One per Fabric tenant, shared by every workload, storing data in Delta Parquet. <em>Shortcuts</em> point at external storage without copying it.`,
      `<strong>Azure Files is a cloud network file share.</strong> Up to 256 TiB per SSD-based account, more for HDD, a single file up to 4 TiB, and up to 2,000 concurrent handles per file or directory. Upload with the portal or AzCopy, and cache locally with Azure File Sync.`,
      `<strong>Azure Files speaks SMB and NFS.</strong> SMB works across Windows, Linux and macOS. NFS is Linux only (kernel 4.3 or later), needs an SSD-tier account and a virtual network. Two media tiers: HDD and SSD, with SSD faster and pricier.`,
      `<strong>Azure Table storage is NoSQL key-value, not a relational table.</strong> Every row needs a <em>partition key</em> plus a <em>row key</em>, and a timestamp records changes. Beyond that, rows can have different columns. No foreign keys, relationships, stored procedures or views.`,
      `<strong>Table data is denormalized on purpose</strong>: one row holds the whole entity, phone numbers and addresses included. Rows with the same partition key are stored together in row-key order, which makes <em>point</em> queries (one row) and <em>range</em> queries (a block of rows in one partition) fast.`,
      `<strong>Azure Cosmos DB is a fully managed, globally distributed, multi-model NoSQL PaaS database.</strong> It is schema-agnostic, indexes every property automatically, and replicates to any Azure regions you add. Reads around 4 ms and writes around 5 ms at the 99th percentile.`,
      `<strong>Cosmos DB's hierarchy is account, database, container, items.</strong> The container is the unit of storage and scaling; that is where you set the partition key, throughput, indexing and time-to-live. A logical partition holds up to 20 GB, so pick a partition key with many distinct, evenly spread values.`,
      `<strong>Throughput is measured in Request Units per second (RU/s)</strong>; one RU is roughly a 1 KB read. Modes: <em>dedicated</em> to one container, <em>shared</em> across up to 25 containers in a database, or <em>serverless</em> pay-per-request (single region only). <em>Autoscale</em> sets a ceiling and adjusts inside it. Five consistency levels run from Strong to Eventual; Session is the common starting point.`,
      `<strong>Five Cosmos DB APIs, matched to the data model.</strong> <em>NoSQL</em> (native, JSON documents, SQL-like queries, recommended for new apps; formerly called the SQL API). <em>MongoDB</em> (BSON documents, MQL, <code>db.products.find()</code>). <em>Table</em> (key-value with PartitionKey and RowKey, the upgrade path from Azure Table storage). <em>Apache Cassandra</em> (column family, CQL). <em>Apache Gremlin</em> (graph: vertices and edges). Pick by the workload you are migrating.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Cosmos DB for NoSQL has no SQL, because it says NoSQL." The native API queries JSON documents with a SQL-like syntax such as <code>SELECT * FROM customers c WHERE c.id = "joe@litware.com"</code>. The name says the data model is non-relational, not that the query language is foreign. The reverse trap also shows up: Azure Table storage has "table" in the name, but it is a key-value store with no joins, no foreign keys and no stored procedures. Read the data model, not the name.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="vz-chip"><b style="color:var(--accent)">Hot</b> default · ms reads</span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Cool</b> 30-day minimum</span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Cold</b> 90-day minimum</span>
      <span class="vz-arrow">→</span>
      <span class="vz-chip"><b>Archive</b> 180-day minimum · offline · up to 15 h to rehydrate</span>
    </div><div class="vz-note">Storage cost drops left to right. Access cost and latency rise. Only Archive has to be rehydrated before you can read it.</div>`},

  {key:'d4', title:'Analytics workloads on Azure: ingestion, stores, Fabric, streaming, Power BI',
    must:[
      `<strong>The large-scale analytics architecture has four layers</strong>: ingestion and processing (ETL or ELT), an analytical data store (warehouse, lake or lakehouse), an analytical data model (semantic model), and data visualization. Microsoft Learn now adds AI-assisted analytics as a fifth.`,
      `<strong>ETL transforms before loading; ELT loads first and transforms inside the store.</strong> Either way the result is optimized for analytical queries. ELT is the common pattern in modern lakehouses because the store has the compute to do the transforming.`,
      `<strong>A pipeline is activities plus linked services.</strong> Activities operate on data, starting from an input dataset and ending at an output dataset. Linked services are the connections to sources and destinations. Azure Data Factory and Fabric Data Factory share this model, so skills transfer.`,
      `<strong>Azure Data Factory is the standalone Azure pipeline service.</strong> Use it when the destination is outside Fabric, such as Azure SQL Database, or when you connect to on-premises sources in a hybrid setup. Fabric Data Factory is the recommended choice when all the work lives in Fabric; it adds <em>Dataflows Gen2</em>, a low-code Power Query transform tool.`,
      `<strong>Fabric has three ways to get data in without writing a pipeline.</strong> <em>Shortcuts</em> reference external storage (ADLS Gen2, S3, Google Cloud Storage) in place. <em>Mirroring</em> replicates a database such as Azure SQL Database, Cosmos DB or Snowflake into OneLake in near real time. <em>Eventstream</em> ingests streaming events.`,
      `<strong>A data warehouse is a relational store shaped as a star schema.</strong> Numeric values sit in central <em>fact</em> tables, related to <em>dimension</em> tables you aggregate by (customer, product, store, time). Adding tables off the dimensions (product to category) makes it a <em>snowflake</em> schema. Pick a warehouse when data is structured and the team writes SQL.`,
      `<strong>A data lake is a file store queried by distributed engines like Apache Spark</strong>, using <em>schema-on-read</em>: the tabular shape is applied when the data is read, not enforced when it is written. Pick a lake for mixed structured, semi-structured and unstructured data.`,
      `<strong>A data lakehouse is the hybrid</strong>: raw files in a lake, with a SQL analytics endpoint exposing them as tables. Delta Lake makes it work by adding schema enforcement and transactions on top of Parquet. Both Fabric and Azure Databricks build on it.`,
      `<strong>Microsoft Fabric is the unified SaaS analytics platform</strong>: data engineering, warehousing, real-time analytics, data science and Power BI in one browser workspace, all on OneLake. You do not manage servers. <em>Fabric Lakehouse</em> for mixed data and Spark work; <em>Fabric Warehouse</em> for a SQL Server-compatible relational warehouse with strong schema enforcement.`,
      `<strong>Azure Databricks is the Apache Spark platform</strong>, running as a managed service inside your subscription, with Delta Lake as its native format. Pieces: notebooks (Python, SQL, Scala, R), Databricks SQL warehouse for BI queries, Unity Catalog for governance, and Lakeflow declarative pipelines for ingestion. Choose it for code-first Spark work and existing Databricks skills.`,
      `<strong>Batch collects records and processes the group at once</strong>, on a schedule or when enough has arrived. Credit card billing is the textbook example. Strengths: large volumes, run off-peak. Weaknesses: latency of hours, and one bad record can stop the whole job.`,
      `<strong>Streaming processes each record as it arrives</strong>, in real time, for time-critical reactions such as a fire alarm. It works on the most recent data or a rolling window, handles small micro-batches, and does simple aggregates such as rolling averages. Latency is seconds or milliseconds.`,
      `<strong>Stream processing architecture in four parts</strong>: an event produces data, a <em>source</em> (often a queue) captures it, a <em>perpetual query</em> selects, projects or aggregates it over time windows, and a <em>sink</em> receives the result. Most solutions combine batch and streaming; the lambda architecture is the named pattern.`,
      `<strong>Sources: Azure Event Hubs, Azure IoT Hub, Data Lake Storage Gen2, Apache Kafka.</strong> Event Hubs ingests high volumes of events, keeps order inside a partition and guarantees at-least-once delivery. IoT Hub is the same idea tuned for devices.`,
      `<strong>Processors: Azure Stream Analytics, Spark Structured Streaming, Fabric Real-Time Intelligence.</strong> Stream Analytics is PaaS: define a streaming job, apply a perpetual query, write to an output. Structured Streaming runs on Spark in Databricks or Fabric. Real-Time Intelligence bundles <em>Eventstreams</em>, <em>Eventhouse</em> (queried with KQL), real-time dashboards and <em>Activator</em> for automated actions. Sinks for the results: Event Hubs for more processing, Data Lake Storage Gen2 or OneLake for files, Azure SQL Database or Fabric for tables, and Power BI when the question ends "visualize in real time".`,
      `<strong>Power BI workflow: Desktop to service to mobile.</strong> Model and build reports in <em>Power BI Desktop</em> (Windows). Publish to the <em>Power BI service</em> to share, schedule refresh, and build dashboards and apps. Consume in a browser or the <em>Power BI phone app</em>. Inside Fabric, Power BI lives in workspaces on OneLake and <em>Direct Lake</em> mode reads Delta tables with no import or refresh.`,
      `<strong>A semantic model is measures plus dimensions.</strong> Measures are the numbers you aggregate (revenue, quantity) stored in fact tables. Dimensions are what you group by (product, customer, time). Hierarchies let you drill from year to month to day. Power BI holds the model in memory in the VertiPaq columnar engine and aggregates at query time. Model view in Desktop is where you set relationships and hierarchies.`,
      `<strong>Pick the visual by the question.</strong> Table or card: show many values, or one key number. Bar or column: compare discrete categories. Line: trends over time. Pie: parts of a whole. Scatter: relationship between two measures. Map: compare geographic areas. Visuals in one report cross-filter each other automatically.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Batch and streaming are two competing choices." On the exam they are two halves of one solution. Streaming captures events and handles the time-critical part: a rolling count, an alert, a live dashboard. Batch handles the heavy, historical part: complex analytics over the full dataset. The same events are often stored for batch processing later. When a question asks for "real-time" or "as it happens", that is streaming. When it asks for "monthly totals" or "complex analysis over all data", that is batch. When it asks for both, it is the combined lambda pattern.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="vz-card" style="flex:1;min-width:200px"><b>Batch</b><span>Collect, then process the group. Hours of latency. Full dataset. Complex analytics. Example: monthly credit card bill.</span></div>
      <div class="vz-card" style="flex:1;min-width:200px"><b>Streaming</b><span>Process each event on arrival. Seconds or milliseconds. Rolling window. Simple aggregates and alerts. Example: counting cars as they pass.</span></div>
    </div><div class="vz-note">Event Hubs or IoT Hub feeds it. Stream Analytics, Spark Structured Streaming or Fabric Real-Time Intelligence processes it. Power BI shows it live.</div>`}
];

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast('Finish and submit the exam to see results.'); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){

}

function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){

function openReview(){ state.reviewFilter = true; save(); setView('study'); }

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }
function toggleStudy(key){
  state.openSections[key] = !state.openSections[key];

}
function toggleAllStudy(){

  STUDY.forEach(s => state.openSections[s.key] = open);
  save(); render();
}

/* ============== EXAM + OPTIONAL TIMER ==============
   The real exam gives you 45 minutes. The timer here matches that and is optional. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Time's up. Exam submitted.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">
        <h2>Practice Exam · ${QUESTIONS.length} questions</h2>
        <p>Spread across the four official areas in the same proportions Microsoft uses. One question at a time. Pick an answer and it locks in and moves you on. Some questions are "choose all that apply" with no partial credit, so read them twice. Everything grades at once when you submit.</p>
        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Start with no time limit</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Timed, ${EXAM_MINUTES}:00 like the real exam ⏱</button>
        </div>
      </div>
      <div class="method-callout">
        <strong>The real exam gives you ${EXAM_MINUTES} minutes.</strong> Microsoft does not publish a fixed question count, and some questions are unscored trial items you cannot identify. Untimed is fine for a first pass. Run it timed once before you book, to practise not overthinking.
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>There is no penalty for guessing.</strong> Microsoft scores with no deduction for wrong answers, so answer everything. An unanswered item scores the same as a wrong one.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">View results →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?'Submit exam':'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<button class="${cls}" onclick="gotoQ(${n})" title="Question ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">DP-900 practice exam${state.timed?' · timed':''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Lock in &amp; submit →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Lock in &amp; continue →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Submit exam →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}>← Prev</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Next →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? 'Choose every option that applies, then lock it in. No partial credit. You need all the right ones and none of the wrong ones.'
      : 'Pick an answer and it locks in, then moves you on. Use Prev or the bars above to change it before you submit.'}
      Nothing is graded until you submit.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : 'Heads up: '}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Still unclear? Get a hint →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?'<span class="ms-tag">· multiple response</span>':''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`You've answered ${answered} of ${QUESTIONS.length}. Unanswered questions count as wrong, like the real exam. Submit anyway?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: Microsoft reports a scaled score from 1 to 1,000 and 700 passes.
   A scaled score is not a raw percent, so we cannot reproduce it. We report raw percent
   and treat 70% as OUR readiness line (real exam: 700 of 1,000 scaled). */
const PASS_PCT = 70;   // our readiness bar (real exam: 700 of 1000 scaled)
const READY_PCT = 80;  // our recommendation, NOT Microsoft's. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:'Clear of our 70% readiness line with room to spare. Take the free official practice assessment, then book it.', tone:'good'};
  if(pct >= PASS_PCT) return {label:'Over our 70% line, but thin. Close your weakest area, then book it.', tone:'warn'};
  if(pct >= 55) return {label:'Under the line, and it is the vocabulary costing you. Work the study guide, then retake this.', tone:'warn'};
  return {label:'Cold start. Read all four areas end to end, then retake this.', tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Practice exam · Results</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Against our readiness bar: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">vs. ${PASS_PCT}% (real exam: 700 of 1,000 scaled)</span></div>
      <p class="score-sub" style="margin-top:14px">The real exam reports a <strong>scaled score from 1 to 1,000 and 700 passes</strong>. Microsoft says that is not simply 70% of the questions, because harder question sets need fewer points. We cannot reproduce the scaling, so we show raw percent and treat <strong>70% as our readiness line</strong>. We suggest ${READY_PCT}%+ here before booking, purely as margin for a question set that phrases things differently.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? 'Clean sweep. Move on.'
          : p >= 80 ? `Nearly there. Reread the <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} study section</a> once.`
          : p >= 50 ? `Shaky, and this area is ${d.range} of the real exam. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Focus here first. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Review answers &amp; explanations</button>

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('apk-theme', next);
  document.getElementById('themeIcon').innerHTML = '<i data-lucide="' + (next === 'dark' ? 'sun' : 'moon') + '"></i>';
  if(window.grainRefreshIcons)grainRefreshIcons();else if(window.lucide)lucide.createIcons();
}
(function initTheme(){
  const saved = localStorage.getItem('apk-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').innerHTML = '<i data-lucide="' + (document.documentElement.getAttribute('data-theme')==='dark'?'sun':'moon') + '"></i>';
})();

function resetAll(){
  if(!confirm('Clear all answers and reset the exam + study guide?')) return;
  localStorage.removeItem(STORE);
  location.reload();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

<script>
// Same robust Lucide refresh as the other kits. Strips data-lucide from output
// and pauses the observer during refresh so it never loops.
function grainRefreshIcons(){
  if(!window.lucide) return;
  if(window._grainObs) window._grainObs.disconnect();
  lucide.createIcons();
  document.querySelectorAll('svg[data-lucide]').forEach(function(s){ s.removeAttribute('data-lucide'); });
  if(window._grainObs) window._grainObs.observe(document.body,{childList:true,subtree:true});
}
(function(){
  function init(){
    grainRefreshIcons();
    if(window.MutationObserver && !window._grainObs){
      window._grainObs=new MutationObserver(grainRefreshIcons);
      window._grainObs.observe(document.body,{childList:true,subtree:true});
    }
  }
  init();
  if(typeof window.lucide==='undefined'){
    var n=0, t=setInterval(function(){ if(window.lucide||++n>60){ clearInterval(t); init(); } },50);
  }
})();
</script>
