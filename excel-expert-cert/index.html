<meta charset="UTF-8">

<title>MO-211 Excel Expert Prep · Analyst Prep Kit</title>

<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:58px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}

<script>
/* ============== STATE ============== */
const STORE = 'apk-excelexpertcert';
const EXAM_MINUTES = 50;   // Certiport lists 50 minutes for MOS exams (Exam lengths page, read 2026-08-22).
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;

function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? 'Key saved. Hints are on.' : 'Key cleared.');
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = 'Add your Anthropic API key on the home page under Hints to turn hints on.'; return; }
  el.textContent = 'Thinking…';
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || 'Request refused. Check your key.'; return; }
    el.textContent = data.content?.[0]?.text || 'No response. Check your key.';
  } catch(e){ el.textContent = 'Request failed. Check your key and your connection.'; }
}
const TUTOR_ROLE = `You are a plain-spoken Excel tutor helping someone study for the Microsoft Office Specialist Excel Expert exam (MO-211, Microsoft 365 Apps). That exam is performance-based in live Excel and covers workbook protection and settings, custom number formats, data validation, conditional formatting, advanced formulas (LET, XLOOKUP, IFS, SWITCH, SUMIFS, PMT, NPER, FILTER, SORTBY), what-if analysis, formula auditing, recorded macros, PivotTables, PivotCharts, and advanced chart types.`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what task the exam is likely to hand you about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : '(no answer)');
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

      `<strong>IFS replaces nested IF.</strong> <code>=IFS(test1, value1, test2, value2, ...)</code>, up to 127 pairs, returns the first TRUE. With no match it returns <code>#N/A</code>, so the idiom is a final pair of <code>TRUE, "Other"</code> as the catch-all.`,
      `<strong>SWITCH compares one expression against a list of values.</strong> <code>=SWITCH(expression, value1, result1, [value2, result2], ..., [default])</code>. The default is the last argument on its own. Use IFS for ranges and comparisons, SWITCH for exact matches.`,

      `<strong>Know the match_mode and search_mode numbers.</strong> match_mode <code>0</code> exact (default), <code>-1</code> exact or next smaller, <code>1</code> exact or next larger, <code>2</code> wildcard. search_mode <code>1</code> first to last (default), <code>-1</code> last to first, <code>2</code> and <code>-2</code> binary search on sorted data.`,

      `<strong>WEEKDAY returns a number, WORKDAY returns a date.</strong> <code>=WEEKDAY(date, [return_type])</code> gives 1 to 7; type 1 (default) starts at Sunday, type 2 starts at Monday, type 3 runs 0 to 6 from Monday. <code>=WORKDAY(start_date, days, [holidays])</code> adds working days, skipping weekends and any dates in the holidays range.`,
      `<strong>Consolidate sums the same layout from several sheets.</strong> Data ▸ Data Tools ▸ <strong>Consolidate</strong>: pick the function, add each source range, tick <em>Top row</em> and <em>Left column</em> to consolidate by category (matching labels) instead of by position, and tick <strong>Create links to source data</strong> to keep it live.`,

      `<strong>FILTER and SORTBY are dynamic arrays.</strong> <code>=FILTER(array, include, [if_empty])</code> spills matching rows and returns <code>#CALC!</code> on no match unless <code>if_empty</code> is given. <code>=SORTBY(array, by_array1, [sort_order1], ...)</code> sorts one range by another; order is <code>1</code> ascending (default) or <code>-1</code> descending.`,

    miscon:`<strong>Misconception to bust:</strong> "SUMIF and SUMIFS take their arguments in the same order." They do not, and the exam loves the swap. <code>SUMIF(range, criteria, [sum_range])</code> tests first and sums last. <code>SUMIFS(sum_range, criteria_range1, criteria1, ...)</code> sums first and tests after. AVERAGEIF and AVERAGEIFS follow the same split. If you only remember one rule, remember "plural S means sum range first".`,
    viz:`<div style="display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12.5px">
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">exact, any direction</span><br>=XLOOKUP(<b>id</b>, A:A, C:C, "none")</div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">same thing, the classic way</span><br>=INDEX(C:C, MATCH(<b>id</b>, A:A, 0))</div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:7px 11px;background:var(--surf)"><span style="color:var(--dim)">only looks right, needs FALSE</span><br>=VLOOKUP(<b>id</b>, A:C, 3, FALSE)</div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px;font-family:var(--font)">Three spellings of one lookup. The exam accepts any that returns the right value.</div>`},

  {key:'d4', title:'Manage advanced charts and tables: dual-axis, statistical charts, PivotTables, PivotCharts',
    must:[
      `<strong>A dual-axis chart is a combo chart with one series on the secondary axis.</strong> Select the chart ▸ Chart Design ▸ <strong>Change Chart Type</strong> ▸ <strong>Combo</strong>, pick a chart type per series, and tick <strong>Secondary Axis</strong> for the one whose numbers are on a different scale. The preset <em>Clustered Column - Line on Secondary Axis</em> does it in one click.`,
      `<strong>Or do it series by series.</strong> Right-click the series ▸ Format Data Series ▸ Series Options ▸ <strong>Secondary Axis</strong>. Add the axis title with Chart Design ▸ Add Chart Element ▸ Axis Titles ▸ Secondary Vertical. Secondary axes are not available on 3-D charts.`,
      `<strong>The six named chart types and where each lives.</strong> <strong>Histogram</strong> and <strong>Box &amp; Whisker</strong>: Insert ▸ Insert Statistic Chart. <strong>Waterfall</strong> and <strong>Funnel</strong>: Insert ▸ Insert Waterfall, Funnel, Stock, Surface or Radar Chart. <strong>Sunburst</strong>: Insert ▸ Insert Hierarchy Chart. <strong>Combo</strong>: Insert ▸ Insert Combo Chart. All are also on the All Charts tab of Recommended Charts.`,
      `<strong>Histogram bins are set on the axis, not the data.</strong> Right-click the horizontal axis ▸ Format Axis ▸ Axis Options: <em>Automatic</em>, <em>Bin width</em>, <em>Number of bins</em>, plus <em>Overflow bin</em> and <em>Underflow bin</em> to lump the tails. Pareto is the sorted histogram with a cumulative line.`,
      `<strong>Box &amp; Whisker options are in Format Data Series.</strong> Show inner points, show outlier points, show mean markers, show mean line, and <em>Quartile Calculation</em> as inclusive or exclusive median. It shows distribution; it is not a column chart with error bars.`,
      `<strong>Waterfall has a Set as total switch.</strong> Click one column twice to select just that point ▸ right-click ▸ Format Data Point ▸ tick <strong>Set as total</strong> so it starts from zero instead of floating. The legend reads Increase, Decrease, Total.`,
      `<strong>Funnel wants two columns, stages and values, largest first.</strong> Sunburst wants a hierarchy laid out in adjacent columns, outer ring at the right; the inner ring is the top level. Both are built with the Chart Design and Format tabs like any other chart.`,
      `<strong>Trendlines go on through Add Chart Element.</strong> Chart Design ▸ Add Chart Element ▸ <strong>Trendline</strong>: Linear, Exponential, Logarithmic, Polynomial, Power, Moving Average. Format Trendline adds <em>Forecast Forward/Backward</em>, <em>Display Equation on chart</em> and <em>Display R-squared value</em>. No trendlines on 3-D, stacked or pie charts.`,
      `<strong>Create a PivotTable at Insert ▸ PivotTable.</strong> Confirm the range or table, choose New Worksheet or Existing Worksheet, and tick <strong>Add this data to the Data Model</strong> only when you need to relate several tables or use Distinct Count. Refresh from right-click ▸ Refresh or PivotTable Analyze ▸ Refresh All.`,
      `<strong>The Field List has four drop zones</strong>: Filters, Columns, Rows, Values. Text fields land in Rows by default, numbers in Values as Sum, dates in Columns with automatic date grouping. Drag to rearrange. The same field can be dropped in Values more than once.`,
      `<strong>Field selections and options means two dialogs.</strong> Right-click a row field ▸ <strong>Field Settings</strong> (subtotals, layout, custom name). Right-click anywhere ▸ <strong>PivotTable Options</strong> (grand totals, "For empty cells show", classic layout, Allow multiple filters per field). Layout choices like Compact, Outline, Tabular and Repeat All Item Labels are under Design ▸ Report Layout.`,
      `<strong>Slicers and Timelines are the visible filters.</strong> PivotTable Analyze ▸ <strong>Insert Slicer</strong> for any field; PivotTable Analyze ▸ <strong>Insert Timeline</strong> for date fields, with Years, Quarters, Months, Days levels. A slicer can drive several PivotTables from the same source through Slicer ▸ <strong>Report Connections</strong>.`,
      `<strong>Group PivotTable data from the right-click menu.</strong> Right-click a date ▸ <strong>Group</strong> ▸ choose Seconds through Years (pick Months and Years together to avoid mixing Januaries). Right-click a number ▸ Group ▸ set <em>By</em> to an interval. Ctrl-click several items ▸ Group to make a manual group. Ungroup is next to it.`,
      `<strong>A calculated field is a new Values column built from other fields.</strong> PivotTable Analyze ▸ Fields, Items, &amp; Sets ▸ <strong>Calculated Field</strong>, name it, write a formula from field names such as <code>=Sales*1.2</code>. It works on the summed totals, cannot use cell references or names, and is not available on Data Model PivotTables (those use Measures).`,
      `<strong>Calculated item is the sibling that most people miss.</strong> Same menu, <strong>Calculated Item</strong>, but it adds a new item inside a field, such as a "West + South" region, computed per record. Fields add columns; items add rows.`,
      `<strong>Value Field Settings has two tabs.</strong> Right-click a value ▸ <strong>Value Field Settings</strong>. <em>Summarize Values By</em>: Sum, Count, Average, Max, Min, Product, Count Numbers, StdDev, Var, and Distinct Count with the Data Model. <em>Show Values As</em>: % of Grand Total, % of Column Total, % of Row Total, % of Parent Row Total, Difference From, % Difference From, Running Total In, Rank Largest to Smallest, Index. The <strong>Number Format</strong> button is on the same dialog.`,
      `<strong>A PivotChart is a chart bound to a PivotTable.</strong> Click in the PivotTable ▸ Insert ▸ <strong>PivotChart</strong>, or Insert ▸ PivotChart ▸ PivotChart &amp; PivotTable to build both from raw data. Filtering either one filters both. Scatter, bubble and stock types are not available for PivotCharts.`,
      `<strong>PivotChart options are the field buttons and the Analyze tab.</strong> The grey buttons on the chart filter fields in place; hide them with PivotChart Analyze ▸ <strong>Field Buttons</strong>. Styles and colors come from the Design tab like any chart. Right-click a category label ▸ <strong>Expand/Collapse</strong> drills into the next level, and double-clicking a Values cell in the PivotTable (Show Details) dumps the underlying rows to a new sheet.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "A calculated field is just a formula typed next to the PivotTable." A formula next to the PivotTable is a worksheet formula; it breaks the moment the PivotTable grows or re-sorts. The exam's "add a calculated field" task means PivotTable Analyze ▸ Fields, Items, &amp; Sets ▸ Calculated Field, with a formula written from field names. It then shows up in the Field List, refreshes with the data, and can be dragged like any other field.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:150px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Calculated Field</b><div style="color:var(--dim);font-size:12px">new column in Values, from field names, on totals</div></div>
      <div style="flex:1;min-width:150px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Calculated Item</b><div style="color:var(--dim);font-size:12px">new row inside a field, per record</div></div>
      <div style="flex:1;min-width:150px;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Show Values As</b><div style="color:var(--dim);font-size:12px">same numbers, shown as % or running total, no formula</div></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Three ways to get a new number out of a PivotTable. Pick the lightest one that does the job.</div>`}
];

/* ============== PRACTICE EXAM: 45 questions ==============
   d1: 6 · d2: 14 · d3: 13 · d4: 12, matching the official weight ranges.
   The real exam is performance-based in live Excel; this is a knowledge check of
   which function, which setting, what happens. Answers trace to support.microsoft.com.
   type 'mc' → correct: index · type 'ms' → correct: [indices] (choose all that apply) */
const QUESTIONS = [
  /* ---------- AREA 1 · Workbook options and settings (6) ---------- */
  {id:'q1', domain:'d1', type:'mc', q:`A workbook has one macro you need in another open workbook. What is the supported way to copy it?`,
    choices:[`Copy the worksheet; macros travel with sheets`, `In the Visual Basic Editor, drag the module from one project to the other in Project Explorer`, `Save the first workbook as a template`, `Use Paste Special ▸ Macros`],
    correct:1,
    explain:`Open both workbooks, press <code>Alt+F11</code>, open Project Explorer (<code>Ctrl+R</code>), and drag the module to the destination project. Then save the destination as .xlsm or .xlsb.`},
  {id:'q2', domain:'d1', type:'mc', q:`You protect a worksheet without unlocking any cells first. What can users do?`,
    choices:[`Edit every cell, because no password was set`, `Edit nothing, because every cell is Locked by default`, `Edit only cells containing formulas`, `Edit only blank cells`],
    correct:1,
    explain:`Every cell carries the Locked flag by default. Protect Sheet enforces that flag, so the whole sheet becomes read-only until you unlock the cells people may edit (<code>Ctrl+1</code> ▸ Protection ▸ clear Locked) before protecting.`},
  {id:'q3', domain:'d1', type:'ms', q:`Which actions does Review ▸ Protect Workbook block? <em>Choose all that apply.</em>`,
    choices:[`Renaming a worksheet`, `Typing in a cell`, `Unhiding a hidden worksheet`, `Inserting a new worksheet`],
    correct:[0,2,3],
    explain:`Protect Workbook guards structure: adding, deleting, moving, renaming, hiding and unhiding sheets. Typing in cells is governed by Protect Sheet, a different command.`},
  {id:'q4', domain:'d1', type:'mc', q:`Where do you change the macro security setting that applies to every workbook Excel opens?`,
    choices:[`File ▸ Info ▸ Protect Workbook`, `File ▸ Options ▸ Trust Center ▸ Trust Center Settings ▸ Macro Settings`, `Review ▸ Allow Edit Ranges`, `Data ▸ Queries &amp; Connections`],
    correct:1,
    explain:`Macro Settings in the Trust Center (also reachable from Developer ▸ Macro Security) holds the four options. The default is "Disable all macros with notification", which is the yellow Enable Content bar.`},
  {id:'q5', domain:'d1', type:'mc', q:`Formulas on a large sheet no longer update when inputs change, and the status bar says Calculate. Which setting was changed?`,
    choices:[`Iterative calculation was enabled`, `Calculation Options was set to Manual`, `The sheet was protected`, `Workbook links were broken`],
    correct:1,
    explain:`Manual calculation (Formulas ▸ Calculation Options, or File ▸ Options ▸ Formulas) stops automatic recalculation. Press <code>F9</code> to recalculate, or switch back to Automatic.`},
  {id:'q6', domain:'d1', type:'mc', q:`Version History under File ▸ Info shows nothing for a workbook. What is the most likely reason?`,
    choices:[`The workbook contains macros`, `The file is saved on a local drive, not OneDrive or SharePoint`, `The file is in .xlsx format`, `AutoSave is on`],
    correct:1,
    explain:`Version history only works for files stored in OneDrive or SharePoint in Microsoft 365. Local files have no version history to show.`},

  /* ---------- AREA 2 · Manage and format data (14) ---------- */
  {id:'q7', domain:'d2', type:'mc', q:`Column A holds full names. You type the first name from A2 into B2 and want Excel to fill the rest of column B by pattern. Which shortcut?`,
    choices:[`Ctrl+D`, `Ctrl+E`, `Ctrl+R`, `Ctrl+Enter`],
    correct:1,
    explain:`<code>Ctrl+E</code> is Flash Fill (also Data ▸ Flash Fill). Ctrl+D fills down the same value, Ctrl+R fills right.`},
  {id:'q8', domain:'d2', type:'mc', q:`You need cells to show 100, 200, 400, 800. In Home ▸ Fill ▸ Series, which Type and Step value?`,
    choices:[`Linear, step 100`, `Growth, step 2`, `Linear, step 2`, `AutoFill, step 200`],
    correct:1,
    explain:`Growth multiplies by the step value each time; Linear adds it. Doubling is Growth with a step of 2.`},
  {id:'q9', domain:'d2', type:'mc', q:`Which formula fills a 10-row by 3-column block with whole numbers from 1 to 50?`,
    choices:[`<code>=RANDARRAY(10,3,1,50,TRUE)</code>`, `<code>=RANDBETWEEN(1,50,10,3)</code>`, `<code>=RANDARRAY(1,50,10,3)</code>`, `<code>=RAND(10,3)*50</code>`],
    correct:0,
    explain:`<code>RANDARRAY([rows],[columns],[min],[max],[whole_number])</code>. The fifth argument TRUE gives integers. RANDBETWEEN returns a single value and RAND takes no arguments.`},
  {id:'q10', domain:'d2', type:'mc', q:`A custom number format has two sections, such as <code>0.0;[Red]-0.0</code>. How is a zero displayed?`,
    choices:[`With the first section`, `With the second section`, `As General`, `Blank`],
    correct:0,
    explain:`With two sections the first is used for positive numbers and zeros and the second for negative numbers. Four sections are positive;negative;zero;text.`},
  {id:'q11', domain:'d2', type:'mc', q:`Which custom format shows 1,250,000 as <code>1,250</code>?`,
    choices:[`<code>#,##0</code>`, `<code>#,##0,</code>`, `<code>#,##0,,</code>`, `<code>0.000</code>`],
    correct:1,
    explain:`A trailing comma scales the number down by one thousand. Two trailing commas would show millions, so 1,250,000 would become 1.`},
  {id:'q12', domain:'d2', type:'mc', q:`In a custom number format, which placeholder shows insignificant zeros, so 5 in <code>0.00</code> appears as 5.00?`,
    choices:[`<code>#</code>`, `<code>0</code>`, `<code>?</code>`, `<code>@</code>`],
    correct:1,
    explain:`<code>0</code> always shows a digit. <code>#</code> hides insignificant zeros, <code>?</code> pads with a space to align decimals, and <code>@</code> is the text placeholder.`},
  {id:'q13', domain:'d2', type:'mc', q:`A validation rule must reject any entry that is not one of the values in H2:H6. Which Allow type and Error Alert style?`,
    choices:[`List, Warning`, `List, Stop`, `Custom, Information`, `Text length, Stop`],
    correct:1,
    explain:`List with the source <code>=$H$2:$H$6</code>. Only the Stop style rejects the entry; Warning and Information both let the user keep the bad value.`},
  {id:'q14', domain:'d2', type:'mc', q:`A user types an invalid value into a validated cell and a dialog appears with Yes and No buttons. Which Error Alert style is set?`,
    choices:[`Stop`, `Warning`, `Information`, `Custom`],
    correct:1,
    explain:`Warning asks whether to continue and accepts the value on Yes. Stop offers Retry or Cancel only. Information shows OK and accepts.`},
  {id:'q15', domain:'d2', type:'mc', q:`Validation rules were added after the data was typed. How do you see which existing cells break them?`,
    choices:[`Data ▸ Data Validation ▸ Circle Invalid Data`, `Formulas ▸ Error Checking`, `Home ▸ Find &amp; Select ▸ Go To Special ▸ Data validation`, `Review ▸ Check Accessibility`],
    correct:0,
    explain:`Circle Invalid Data draws red circles around cells that violate their rule. Go To Special only selects cells that have validation, valid or not.`},
  {id:'q16', domain:'d2', type:'mc', q:`Data ▸ Subtotal is grayed out. Why?`,
    choices:[`The data is not sorted`, `The data is formatted as an Excel Table`, `The sheet has more than one outline level`, `The column contains text`],
    correct:1,
    explain:`Subtotals are not supported inside an Excel Table. Convert it to a range (Table Design ▸ Convert to Range) and the command returns. Unsorted data makes bad subtotals but does not gray the button.`},
  {id:'q17', domain:'d2', type:'mc', q:`You run Remove Duplicates with only the Email column ticked. Two rows share an email but have different names. What happens?`,
    choices:[`Neither row is removed because the names differ`, `The second row is removed; the first occurrence is kept`, `Both rows are removed`, `Excel asks which one to keep`],
    correct:1,
    explain:`Duplicates are judged only on the ticked columns. The first occurrence stays and later matches are permanently deleted.`},
  {id:'q18', domain:'d2', type:'mc', q:`A2:F50 is selected. Which formula rule shades an entire row when that row's value in column E is greater than 1000?`,
    choices:[`<code>=E2&gt;1000</code>`, `<code>=$E2&gt;1000</code>`, `<code>=$E$2&gt;1000</code>`, `<code>=E$2&gt;1000</code>`],
    correct:1,
    explain:`The rule is written for the top-left cell (A2) and copied across the range. Locking the column with <code>$E</code> keeps every cell in the row looking at column E, while the unlocked row number moves down.`},
  {id:'q19', domain:'d2', type:'ms', q:`Which statements about Conditional Formatting ▸ Manage Rules are true? <em>Choose all that apply.</em>`,
    choices:[`Rules are evaluated from top to bottom`, `Stop If True halts evaluation of lower rules once a rule is true`, `Stop If True can be set on a data bar rule`, `Move Up and Move Down change precedence`],
    correct:[0,1,3],
    explain:`Higher rules win. Stop If True stops lower rules from applying, but it is unavailable for data bars, color scales and icon sets.`},
  {id:'q20', domain:'d2', type:'mc', q:`Which keyboard shortcut hides the detail rows of a selected outline group?`,
    choices:[`Alt+Shift+=`, `Alt+Shift+-`, `Ctrl+9`, `Ctrl+Shift+(`],
    correct:1,
    explain:`<code>Alt+Shift+-</code> collapses a group; <code>Alt+Shift+=</code> expands it. Ctrl+9 hides rows without any outline.`},

  /* ---------- AREA 3 · Advanced formulas and macros (13) ---------- */
  {id:'q21', domain:'d3', type:'mc', q:`Which formula returns "A" for 90 and above, "B" for 80 to 89, and "C" for everything else?`,
    choices:[`<code>=IFS(A2&gt;=90,"A",A2&gt;=80,"B","C")</code>`, `<code>=IFS(A2&gt;=90,"A",A2&gt;=80,"B",TRUE,"C")</code>`, `<code>=SWITCH(A2,90,"A",80,"B","C")</code>`, `<code>=IF(A2&gt;=90,"A","B","C")</code>`],
    correct:1,
    explain:`IFS needs pairs, so the catch-all is <code>TRUE,"C"</code>. Without it, values under 80 return #N/A. SWITCH tests exact matches, not ranges.`},
  {id:'q22', domain:'d3', type:'mc', q:`Which formula totals column D where column B is "East" and column C is over 500?`,
    choices:[`<code>=SUMIFS(B:B,"East",C:C,"&gt;500",D:D)</code>`, `<code>=SUMIFS(D:D,B:B,"East",C:C,"&gt;500")</code>`, `<code>=SUMIF(B:B,"East",C:C,"&gt;500",D:D)</code>`, `<code>=SUMIFS(D:D,B:B="East",C:C&gt;500)</code>`],
    correct:1,
    explain:`SUMIFS puts the sum range first, then criteria_range and criteria pairs, with criteria as text. SUMIF takes only one condition.`},
  {id:'q23', domain:'d3', type:'mc', q:`What does <code>=LET(x, A1*12, IF(x&gt;100, x, 0))</code> do?`,
    choices:[`Returns an error because LET needs three pairs`, `Stores A1*12 as x, then returns x if it is over 100 and 0 otherwise`, `Creates a named range called x in Name Manager`, `Multiplies A1 by 12 and by 100`],
    correct:1,
    explain:`LET binds a name to a value for the duration of the formula, then evaluates the final calculation. The name exists only inside the formula.`},
  {id:'q24', domain:'d3', type:'mc', q:`An XLOOKUP returns #N/A when the ID is missing. Which argument replaces that with "Not found"?`,
    choices:[`match_mode`, `if_not_found`, `search_mode`, `return_array`],
    correct:1,
    explain:`The fourth argument, <code>if_not_found</code>, is the built-in fallback: <code>=XLOOKUP(id, A:A, C:C, "Not found")</code>. No IFERROR wrapper needed.`},
  {id:'q25', domain:'d3', type:'mc', q:`In XLOOKUP, which match_mode returns the exact match or the next smaller value?`,
    choices:[`0`, `1`, `-1`, `2`],
    correct:2,
    explain:`0 is exact only, -1 is exact or next smaller, 1 is exact or next larger, 2 is wildcard.`},
  {id:'q26', domain:'d3', type:'mc', q:`The lookup value is in column D and the value to return is in column A. Which formula works?`,
    choices:[`<code>=VLOOKUP(G2,A:D,1,FALSE)</code>`, `<code>=INDEX(A:A,MATCH(G2,D:D,0))</code>`, `<code>=HLOOKUP(G2,A:D,1,FALSE)</code>`, `<code>=MATCH(G2,D:D,0)</code>`],
    correct:1,
    explain:`VLOOKUP only returns columns to the right of its lookup column. INDEX/MATCH (or XLOOKUP) looks in any direction. MATCH alone returns a position, not the value.`},
  {id:'q27', domain:'d3', type:'mc', q:`<code>=WEEKDAY(A2,2)</code> returns 1. What day is in A2?`,
    choices:[`Sunday`, `Monday`, `Saturday`, `Friday`],
    correct:1,
    explain:`return_type 2 numbers the week Monday = 1 through Sunday = 7. The default type 1 starts at Sunday = 1.`},
  {id:'q28', domain:'d3', type:'mc', q:`Which formula gives the delivery date 10 working days after B2, skipping the holidays in H2:H8?`,
    choices:[`<code>=B2+10</code>`, `<code>=WORKDAY(B2,10,H2:H8)</code>`, `<code>=WEEKDAY(B2,10,H2:H8)</code>`, `<code>=NETWORKDAYS(B2,10,H2:H8)</code>`],
    correct:1,
    explain:`WORKDAY(start_date, days, [holidays]) steps over weekends and listed holidays and returns a date. WEEKDAY returns a day number; NETWORKDAYS counts days between two dates.`},
  {id:'q29', domain:'d3', type:'mc', q:`A loan payment formula is in B5. You want the payment to be 900 by changing the interest rate in B3. In Goal Seek, what goes in each box?`,
    choices:[`Set cell B3, To value 900, By changing cell B5`, `Set cell B5, To value 900, By changing cell B3`, `Set cell B5, To value B3, By changing cell 900`, `Set cell B3, To value B5, By changing cell 900`],
    correct:1,
    explain:`Set cell is the formula, To value is the target, By changing cell is the single input the formula depends on.`},
  {id:'q30', domain:'d3', type:'mc', q:`Which formula returns the monthly payment on a 200,000 loan at 6% annual interest over 30 years?`,
    choices:[`<code>=PMT(6%,30,200000)</code>`, `<code>=PMT(6%/12,30*12,200000)</code>`, `<code>=NPER(6%/12,30*12,200000)</code>`, `<code>=PMT(200000,6%/12,360)</code>`],
    correct:1,
    explain:`PMT(rate, nper, pv). Rate and periods must share a unit, so monthly means 6%/12 and 30*12. The result is negative because it is an outgoing payment.`},
  {id:'q31', domain:'d3', type:'ms', q:`Which statements about FILTER and SORTBY are true? <em>Choose all that apply.</em>`,
    choices:[`<code>FILTER</code> returns #CALC! when nothing matches and no if_empty is given`, `<code>SORTBY</code> sort_order uses 1 for ascending and -1 for descending`, `<code>SORTBY</code> can only sort by the first column of the array`, `Both spill results into neighbouring cells`],
    correct:[0,1,3],
    explain:`FILTER(array, include, [if_empty]) and SORTBY(array, by_array1, [sort_order1], ...) are dynamic array functions. SORTBY sorts by any separate range, not just the first column.`},
  {id:'q32', domain:'d3', type:'mc', q:`You need to see the value of a cell on another sheet while editing formulas here. Which Formula Auditing tool?`,
    choices:[`Trace Dependents`, `Watch Window`, `Evaluate Formula`, `Show Formulas`],
    correct:1,
    explain:`The Watch Window pins cells from any sheet or workbook and shows their value and formula as they change.`},
  {id:'q33', domain:'d3', type:'mc', q:`A recorded macro must always format the currently selected cell, not a fixed address. Which Developer tab option must be on while recording?`,
    choices:[`Macro Security`, `Use Relative References`, `Design Mode`, `Record in Personal Macro Workbook`],
    correct:1,
    explain:`Use Relative References records moves relative to the active cell. Without it the recorder writes absolute addresses like Range("B5").`},

  /* ---------- AREA 4 · Advanced charts and tables (12) ---------- */
  {id:'q34', domain:'d4', type:'mc', q:`A column chart shows Revenue in millions and Units in the hundreds, so Units is invisible. Which steps fix it?`,
    choices:[`Change Chart Type ▸ Combo ▸ tick Secondary Axis for Units`, `Add Chart Element ▸ Data Labels`, `Switch Row/Column`, `Format Axis ▸ Logarithmic scale on the primary axis`],
    correct:0,
    explain:`A dual-axis (combo) chart plots Units on its own secondary axis, usually as a line. Secondary axes are unavailable on 3-D charts.`},
  {id:'q35', domain:'d4', type:'mc', q:`Where is the Bin width setting for a Histogram chart?`,
    choices:[`Chart Design ▸ Add Chart Element`, `Format Axis ▸ Axis Options on the horizontal axis`, `Select Data`, `Format Data Series ▸ Gap Width`],
    correct:1,
    explain:`Histogram bins (Automatic, Bin width, Number of bins, Overflow bin, Underflow bin) are axis options on the category axis.`},
  {id:'q36', domain:'d4', type:'mc', q:`In a Waterfall chart the final "Net Income" column floats instead of starting at zero. What fixes it?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast('Finish and submit the exam to see results.'); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

/* ============== EXAM + OPTIONAL TIMER ==============
   The real MOS exam is 50 minutes of live tasks. The timer here is an optional pacing
   drill against that same length. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Pacing drill over. Exam submitted.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">

        <p>Spread across the four official areas in their published proportions. One question at a time. Pick an answer and it locks in and moves you on. A few questions are "choose all that apply" with no partial credit, so read them twice. Everything grades at once when you submit.</p>
        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Start with no time limit</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Pacing drill, ${EXAM_MINUTES}:00 ⏱</button>
        </div>
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>This is a knowledge check, not the exam.</strong> The real MO-211 hands you workbooks and grades what you did to them in ${EXAM_MINUTES} minutes. Knowing the right move is necessary. It is not sufficient. After this drill, open Excel and do every move you got wrong, twice.
      </div>
      <div class="method-callout">
        <strong>Why a timer at all.</strong> Certiport lists 50 minutes for 23 to 27 tasks, which is under two minutes each. The pacing drill is here so that "where is that dialog" stops being a question you answer slowly.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">View results →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?'Submit exam':'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<button class="${cls}" onclick="gotoQ(${n})" title="Question ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">MO-211 Excel Expert practice drill${state.timed?' · pacing drill':''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Lock in &amp; submit →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Lock in &amp; continue →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Submit exam →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}>← Prev</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Next →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? 'Choose every option that applies, then lock it in. No partial credit. You need all the right ones and none of the wrong ones.'
      : 'Pick an answer and it locks in, then moves you on. Use Prev or the bars above to change it before you submit.'}
      Nothing is graded until you submit.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : 'Heads up: '}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Still unclear? Get a hint →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?'<span class="ms-tag">· multiple response</span>':''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`You've answered ${answered} of ${QUESTIONS.length}. Unanswered questions count as wrong. Submit anyway?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: the real exam reports a scaled 1 to 1000 score with 700 to pass (Certiport).
   There is no published mapping from tasks to scaled score, so we grade this knowledge
   check on raw percent and use 70% as OUR line, labelled as ours on the page. */
const PASS_PCT = 70;   // ours, mirrors the 700/1000 shape
const READY_PCT = 85;  // our recommendation, NOT Microsoft's. Margin for the live-app gap

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:'Clear of our 70% line with room. Now rep the moves in real Excel and book it.', tone:'good'};
  if(pct >= PASS_PCT) return {label:'Over our 70% line, but thin. Close the weak area, rep it hands-on, then book it.', tone:'warn'};
  if(pct >= 55) return {label:'Under the line. Work the study guide on the areas below, then retake this.', tone:'warn'};
  return {label:'Cold start. Read all four areas end to end, then retake this.', tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Practice drill · Results</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Against our line: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">vs. ${PASS_PCT}% (ours)</span></div>
      <p class="score-sub" style="margin-top:14px">The real MO-211 grades live tasks in Excel on a 1 to 1000 scale with 700 to pass, so treat this as a knowledge check, not a score prediction. The ${PASS_PCT}% line is ours and only mirrors that shape. ${READY_PCT}%+ here plus comfortable in-app practice = ready.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? 'Clean sweep. Rep it in real Excel and move on.'
          : p >= 80 ? `Nearly there. Reread the <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} study section</a> once, then do the task in Excel.`
          : p >= 50 ? `Shaky. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Focus here first. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Review answers &amp; explanations</button>
      <button class="btn btn-ghost" onclick="setView('study')">Open study guide</button>
      <button class="btn btn-primary" onclick="retake()">Retake drill <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm('Clear your answers and retake the practice drill?')) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

  }
  init();

    var n=0, t=setInterval(function(){ if(window.lucide||++n>60){ clearInterval(t); init(); } },50);
