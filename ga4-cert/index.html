<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Analytics Certification Prep · Analyst Prep Kit</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/ga4-cert/">
<meta name="description" content="Prep for the Google Analytics Certification on Skillshop. An area-by-area study guide of GA4 setup, events and key events, reports and explorations, audiences and admin, plus a 50-question practice exam graded at 80%.">
<link rel="stylesheet" href="../assets/grain/grain.css">
<link rel="stylesheet" href="../assets/grain/zinc-sky.css"><!-- Zinc & Sky palette rollout -->
<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>
</head>
<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Back to all kits">← All Kits</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Google Analytics (GA4) Prep</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>
  <button class="nav-btn" id="navStudy" onclick="setView('study')">Study Guide</button>
  <button class="nav-btn" id="navExam" onclick="setView('exam')">Practice Exam</button>
  <button class="nav-btn" id="navResults" onclick="setView('results')" style="display:none">Results</button>

<main id="app"></main>

<script>
/* ============== STATE ============== */
const STORE = 'apk-ga4cert';
const EXAM_MINUTES = 75;   // 75 minutes is the widely reported limit. Not verified on the official page.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;

async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = 'Add your Anthropic API key on the home page under Hints to turn hints on.'; return; }
  el.textContent = 'Thinking…';
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || 'Request refused. Check your key.'; return; }
    el.textContent = data.content?.[0]?.text || 'No response. Check your key.';
  } catch(e){ el.textContent = 'Request failed. Check your key and your connection.'; }
}

  {id:'q11', domain:'d1', type:'ms', q:`Which are consent mode parameters? <em>Choose all that apply.</em>`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast('Finish and submit the exam to see results.'); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

        <div class="cta-title">Study the admin console</div>
        <div class="cta-desc">The four areas, one setting at a time: what each one does, the number or limit worth memorising, and the confusion the exam is written to catch.</div>
        <div class="cta-link">Open study guide →</div>
      </a>
      <a class="cta-card primary" onclick="setView('exam')">
        <div class="cta-icon"><i data-lucide="clipboard-list"></i></div>
        <div class="cta-title">${state.submitted ? 'Review your exam' : (inProgress ? 'Resume the practice exam' : 'Take the practice exam')}</div>
        <div class="cta-desc">${state.submitted ? `You scored ${calcScore().total}/${total}. Reopen to review the answers, or retake it.` : `50 questions across the four areas, graded at the 80% line. Includes multiple-response questions so you practise reading carefully. ${answered ? `You've answered ${answered}/${total}.` : ''}`}</div>
        <div class="cta-link">${state.submitted ? 'Review results →' : (inProgress ? 'Continue →' : 'Start →')}</div>
      </a>
    </div>

    <div class="method-callout">
      <strong>🗣️ Say it out loud.</strong> Most GA4 questions come down to two things that sound alike: sessions or users, an event or a key event, a dimension or a metric, sampling or thresholding, an audience or a segment, a report or an exploration. If you can say the difference in one sentence out loud, the phrasing of the question stops mattering.
    </div>

    <div class="method-callout" style="border-left-color:var(--c-d1)">
      <strong>Ten misses is the whole budget.</strong> Fifty questions at 80% means 40 correct passes and 39 does not. A lot of the shortfall is numbers, so the study guide puts every GA4 limit and default in one place rather than burying them in prose.
    </div>

    ${needsReviewCount()>0?`<div class="method-callout" style="border-left-color:var(--warn)">
      <strong>🔁 ${needsReviewCount()} concept${needsReviewCount()===1?'':'s'} flagged for review.</strong> You rated ${needsReviewCount()===1?'it':'them'} "Not yet" or "Almost" in the study guide. <a href="#" onclick="openReview();return false;">Filter to just those →</a>
    </div>`:''}

    <div class="method-callout" style="border-left-color:var(--accent)">
      <strong>💡 Hints.</strong> ${getCoachKey()
        ? `Hints are on. Every study-guide point has a <em>Stuck? Get a hint →</em> button that explains it a different way, and every missed exam question gets one too. <a href="#" onclick="setCoachKey('');return false;">Turn hints off</a>`
        : `Optional. Paste an Anthropic API key and every study-guide point gets a <em>Stuck? Get a hint →</em> button that explains it a different way. Missed exam questions get one too. The key is stored only in this browser, and it is the same key the SQL, Excel, Python, Power BI, Tableau and Stats kits use.
      <div class="hint-key-row">
        <input id="hintKey" type="password" placeholder="sk-ant-..." autocomplete="off">
        <button type="button" onclick="setCoachKey(document.getElementById('hintKey').value)">Save key</button>
      </div>`}
    </div>

    <div class="method-callout" style="border-left-color:var(--c-d3)">
      <strong>Where the content comes from.</strong> Every study point and every answer here is taken from Google's own <a href="https://support.google.com/analytics" target="_blank" rel="noopener">Google Analytics Help Center</a>, and each area links to the page it came from. Anything we could not find on a Help Center page was left out. Google does not publish a study guide for this certification, so the Help Center is the closest thing to a syllabus there is.
    </div>

    <div class="method-callout" style="border-left-color:var(--c-d2)">
      <strong>Also here:</strong> the <a href="../tableau-cert/">Tableau Cert Prep</a> and <a href="../powerbi-cert/">Power BI Cert Prep</a> kits. Different exams, same shape.
    </div>
  `;
}

function renderStudy(){
  return `
    <div class="study-intro">
      <p><strong>GA4, one area at a time.</strong> Click an area to expand. Every point is a setting, a limit or a behavior worth knowing cold; the yellow callouts are the confusions this material is written to catch.</p>
      <p>Every point traces to a page in the Google Analytics Help Center. Each area links to its source at the bottom.</p>
    </div>
    <button class="expand-all" onclick="toggleAllStudy()">${allStudyOpen() ? 'Collapse all' : 'Expand all'}</button>
    <button class="expand-all ${state.reviewFilter?'rf-on':''}" onclick="toggleReviewFilter()">${state.reviewFilter ? `Showing needs-review only (${needsReviewCount()}), show all` : `Filter: needs review (${needsReviewCount()})`}</button>
    ${STUDY.map(s=>{
      const d = DOMAIN_INFO[s.key];
      const vis = s.must.map((m,i)=>({m,i})).filter(x=>{
        if(!state.reviewFilter) return true;
        const lvl = state.conf[s.key+'-'+x.i];
        return lvl==='low' || lvl==='mid';
      });
      if(state.reviewFilter && vis.length===0) return '';
      const open = state.reviewFilter ? true : !!state.openSections[s.key];
      return `
        <div class="study-section ${open?'open':''}" id="study-${s.key}">
          <div class="study-head" onclick="toggleStudy('${s.key}')">
            <span class="study-pill" style="color:${d.color}">${d.label} · ${d.weight}%</span>
            <span class="study-title">${s.title}</span>
            <span class="study-toggle">▸</span>
          </div>
          <div class="study-body">
            ${state.reviewFilter?'':`<div class="study-viz"><div class="sv-cap"><i data-lucide="monitor"></i> See it</div>${s.viz}</div>`}
            <ul>${vis.map(x=>studyItemHTML(s.key,x.i,x.m)).join('')}</ul>
            ${state.reviewFilter?'':`<div class="miscon">${s.miscon}</div>`}
            <a class="study-link" href="${d.docPath}" target="_blank" rel="noopener">Source: ${d.docLabel} →</a>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

/* ===== Concept confidence + needs-review filter ===== */
function studyItemHTML(key,i,m){
  const id = key+'-'+i;
  const lvl = state.conf[id];
  const chip = (l,txt)=>`<button class="conf-chip ${lvl===l?('on '+l):''}" onclick="rateConf('${id}','${l}')">${txt}</button>`;
  return `<li>${m}<div class="li-foot"><span class="conf-chips">${chip('low','✗ Not yet')}${chip('mid','~ Almost')}${chip('high','✓ Have it')}</span><button class="hint-btn" onclick="hintStudy('${key}',${i})">Stuck? Get a hint →</button></div><div class="hint-resp" id="hint-resp-${id}"></div></li>`;
}
function rateConf(id,lvl){
  if(state.conf[id]===lvl) delete state.conf[id];
  else state.conf[id]=lvl;
  save(); render();
}
function needsReviewCount(){ return Object.values(state.conf).filter(v=>v==='low'||v==='mid').length; }
function toggleReviewFilter(){
  if(!state.reviewFilter && needsReviewCount()===0){ toast('Rate a concept "Not yet" or "Almost" first, then filter to just those.'); return; }
  state.reviewFilter = !state.reviewFilter;
  save(); render();
}
function openReview(){ state.reviewFilter = true; save(); setView('study'); }

function allStudyOpen(){ return STUDY.every(s => state.openSections[s.key]); }
function toggleStudy(key){
  state.openSections[key] = !state.openSections[key];
  save(); render();
}
function toggleAllStudy(){
  const open = !allStudyOpen();
  STUDY.forEach(s => state.openSections[s.key] = open);
  save(); render();
}

/* ============== EXAM + OPTIONAL TIMER ==============
   75 minutes is the widely reported limit, not a verified one. The timer is an
   optional pacing drill against that reported figure, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Pacing drill over. Exam submitted.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderExam(){
  if(state.examStart === null && !state.submitted){
    return `
      <div class="start-card">
        <h2>Practice Exam · ${QUESTIONS.length} questions</h2>
        <p>Spread across the four areas of GA4. One question at a time. Pick an answer and it locks in and moves you on. Some questions are "choose all that apply" with no partial credit, so read them twice. Everything grades at once when you submit.</p>
        <div class="start-actions">
          <button class="btn btn-primary" onclick="startExam(false)">Start with no time limit</button>
          <button class="btn btn-ghost" onclick="startExam(true)">Pacing drill, ${EXAM_MINUTES}:00 ⏱</button>
        </div>
      </div>
      <div class="method-callout">
        <strong>About the clock.</strong> The real exam is reported to run ${EXAM_MINUTES} minutes, though we could not verify that on the official page. Untimed is the better way to learn the material. Turn the pacing drill on once you want to practise not overthinking.
      </div>
      <div class="method-callout" style="border-left-color:var(--warn)">
        <strong>Ten misses is the whole budget.</strong> Fifty questions at 80% means 40 correct passes and 39 does not. Answer everything. An unanswered item scores the same as a wrong one.
      </div>
    `;
  }

  const answered = Object.keys(state.answers).length;
  const total = QUESTIONS.length;
  const pct = Math.round(100*answered/total);
  const left = timeLeftMs();

  let topBtn;
  if(state.submitted) topBtn = `<button class="exam-submit-btn" onclick="setView('results')">View results →</button>`;
  else topBtn = `<button class="exam-submit-btn" onclick="submitExam()" ${answered===0?'disabled':''}>${answered===total?'Submit exam':'Submit ('+answered+'/'+total+' answered)'}</button>`;

  const i = clampQIdx();
  const q = QUESTIONS[i];
  const d = DOMAIN_INFO[q.domain];

  const dots = QUESTIONS.map((qq, n) => {
    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';
    if(n === i) cls += ' cur';
    return `<button class="${cls}" onclick="gotoQ(${n})" title="Question ${n+1}"></button>`;
  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">
          <div class="exam-mini-title">Google Analytics (GA4) practice exam${state.timed?' · pacing drill':''}</div>
          <div class="exam-q-progress"><span>${answered}</span> of ${total} answered</div>
        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}
        ${topBtn}
      </div>
      <div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-dots">${dots}</div>
    <div class="section-header">
      <span class="section-pill" style="color:${d.color}">${d.label}</span>
      <span class="section-name">${d.name}</span>
    </div>
    ${renderQuestion(q)}
  `;

  const isLast = i === QUESTIONS.length - 1;
  let primary = '';
  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast
        ? `<button class="btn btn-primary" onclick="submitExam()">Lock in &amp; submit →</button>`
        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Lock in &amp; continue →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Submit exam →</button>`;
    }
  }

  html += `
    <div class="q-nav">
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i-1})" ${i===0?'disabled':''}>← Prev</button>
      <div class="spacer"></div>
      ${primary}
      <button class="btn btn-outline btn-sm" onclick="gotoQ(${i+1})" ${isLast?'disabled':''}>Next →</button>
    </div>
  `;

  if(!state.submitted){
    html += `<div class="lockin-hint">${q.type==='ms'
      ? 'Choose every option that applies, then lock it in. No partial credit. You need all the right ones and none of the wrong ones.'
      : 'Pick an answer and it locks in, then moves you on. Use Prev or the bars above to change it before you submit.'}
      Nothing is graded until you submit.</div>`;
  }
  return html;
}

function hasAnswer(q){
  const a = state.answers[q.id];
  return q.type === 'ms' ? (Array.isArray(a) && a.length > 0) : a !== undefined;
}

function clampQIdx(){
  let i = Number.isInteger(state.qIdx) ? state.qIdx : 0;
  if(i < 0) i = 0;
  if(i > QUESTIONS.length - 1) i = QUESTIONS.length - 1;
  state.qIdx = i;
  return i;
}

function gotoQ(n){
  state.qIdx = Math.max(0, Math.min(QUESTIONS.length - 1, n));
  save();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderQuestion(q){
  const idx = QUESTIONS.findIndex(x=>x.id===q.id) + 1;
  const ans = state.answers[q.id];
  const isMs = q.type === 'ms';
  const hasAns = isMs ? (Array.isArray(ans) && ans.length>0) : (ans !== undefined);
  let stateCls = '';
  if(state.submitted) stateCls = isCorrect(q) ? ' correct' : ' incorrect';
  else if(hasAns) stateCls = ' answered';

  const body = `<div class="choices">${q.choices.map((c,i)=>{
    const picked = isMs ? (Array.isArray(ans) && ans.includes(i)) : ans === i;
    const isRight = isMs ? q.correct.includes(i) : q.correct === i;
    let cls = 'choice';
    if(state.submitted){
      if(isRight) cls += ' correct-answer';
      else if(picked) cls += ' wrong-answer';
    } else if(picked){
      cls += ' selected';
    }
    const letter = String.fromCharCode(65+i);
    const mark = isMs ? (picked ? '☑' : '☐') : letter;
    return `<button class="${cls}" onclick="${isMs?`answerMs('${q.id}',${i})`:`answerMc('${q.id}',${i})`}" ${state.submitted?'disabled':''}>
      <span class="choice-letter">${mark}</span>
      <span class="choice-text">${c}</span>
    </button>`;
  }).join('')}</div>`;

  const explanation = state.submitted
    ? `<div class="explanation show"><strong>${isCorrect(q) ? 'Correct.' : 'Heads up: '}</strong> ${q.explain}${isCorrect(q) ? '' : `<div style="margin-top:10px"><button class="hint-btn" onclick="hintQuestion('${q.id}')">Still unclear? Get a hint →</button></div><div class="hint-resp" id="hint-resp-q-${q.id}"></div>`}</div>`
    : '';

  return `
    <div class="q-card${stateCls}" id="q-${q.id}">
      <div class="q-num">Question ${idx} of ${QUESTIONS.length}${isMs?'<span class="ms-tag">· multiple response</span>':''}</div>
      <div class="q-text">${q.q}</div>
      ${body}
      ${explanation}
    </div>
  `;
}

function answerMc(qid, idx){
  if(state.submitted) return;
  state.answers[qid] = idx;
  save();
  const at = QUESTIONS.findIndex(x => x.id === qid);
  if(at > -1 && at < QUESTIONS.length - 1){ gotoQ(at + 1); return; }
  render();
}
function answerMs(qid, idx){
  if(state.submitted) return;
  let cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
  if(cur.includes(idx)) cur = cur.filter(i=>i!==idx);
  else cur.push(idx);
  if(cur.length) state.answers[qid] = cur;
  else delete state.answers[qid];
  save();
  render();
}

function isCorrect(q){
  const ans = state.answers[q.id];
  if(q.type === 'ms'){
    if(!Array.isArray(ans)) return false;
    const a = ans.slice().sort().join(',');
    const c = q.correct.slice().sort().join(',');
    return a === c;
  }
  return ans === q.correct;
}

function submitExam(auto){
  if(state.submitted) return;
  const answered = Object.keys(state.answers).length;
  if(!auto && answered < QUESTIONS.length){
    if(!confirm(`You've answered ${answered} of ${QUESTIONS.length}. Unanswered questions count as wrong, like the real exam. Submit anyway?`)) return;
  }
  state.submitted = true;
  state.qIdx = 0;
  save();
  setView('results');
}

function calcScore(){
  const byDomain = {};
  let total = 0;
  for(const d of DOMAIN_ORDER){
    const qs = QUESTIONS.filter(q=>q.domain===d);
    const correct = qs.filter(isCorrect).length;
    byDomain[d] = {correct, total: qs.length};
    total += correct;
  }
  return {total, byDomain, outOf: QUESTIONS.length};
}

/* Scoring: 80% is the widely reported pass mark for this exam, not one we verified.
   There is no scaled score, so we report raw percent against that same line. */
const PASS_PCT = 80;
const READY_PCT = 88; // our recommendation, NOT Google's. Margin for a harder question set

function verdictFor(pct){
  if(pct >= READY_PCT) return {label:'Clear of the 80% line with room to spare. Book it.', tone:'good'};
  if(pct >= PASS_PCT) return {label:'Over the 80% line, but thin. Close your weakest area, then book it.', tone:'warn'};
  if(pct >= 65) return {label:'Under the line, and it is the numbers costing you. Work the study guide, then retake this.', tone:'warn'};
  return {label:'Cold start. Read all four areas end to end, then retake this.', tone:'bad'};
}

function renderResults(){
  const score = calcScore();
  const pct = Math.round(100 * score.total / score.outOf);
  const v = verdictFor(pct);
  const pass = pct >= PASS_PCT;
  return `
    <div class="results-hero">
      <div class="results-eyebrow">Practice exam · Results</div>
      <div class="score-big">${score.total}<small>/${score.outOf}</small></div>
      <div class="score-verdict">${pct}%. ${v.label}</div>
      <div class="scaled-box">Against the real bar: <strong style="color:${pass?'var(--good)':'var(--bad)'}">${pct}%</strong> <span style="color:var(--dim)">vs. ${PASS_PCT}% needed</span></div>
      <p class="score-sub" style="margin-top:14px">The real exam is reported to be 50 questions with <strong>80%</strong> needed to pass, so ten misses is the entire budget. That figure is as reported, not verified. We suggest ${READY_PCT}%+ here before you sit it, purely as margin for a question set that phrases things differently.</p>
    </div>

    <div class="results-grid">
      ${DOMAIN_ORDER.map(k=>{
        const d = DOMAIN_INFO[k];
        const s = score.byDomain[k];
        const p = Math.round(100*s.correct/s.total);
        const hint = p === 100 ? 'Clean sweep. Move on.'
          : p >= 80 ? `Nearly there. Reread the <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">${d.label} study section</a> once.`
          : p >= 50 ? `Shaky, and at 80% to pass that is expensive. <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Study section</a> · ${d.hint}`
          : `Focus here first. ${d.hint} <a href="#study-${k}" onclick="setView('study',{scrollToSection:'${k}'});return false;">Open the study section</a>.`;
        return `
          <div class="results-row">
            <div class="results-row-top">
              <span class="results-pill" style="color:${d.color}">${d.label}</span>
              <span class="results-section-name">${d.name}</span>
              <span class="results-score">${s.correct}/${s.total}</span>
            </div>
            <div class="results-bar"><div class="results-bar-fill" style="width:${p}%;background:${d.color}"></div></div>
            <div class="results-hint">${hint}</div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="results-actions">
      <button class="btn btn-ghost" onclick="setView('exam')">Review answers &amp; explanations</button>
      <button class="btn btn-ghost" onclick="setView('study')">Open study guide</button>
      <button class="btn btn-primary" onclick="retake()">Retake exam <i data-lucide="rotate-ccw" style="width:14px;height:14px;vertical-align:-2px"></i></button>
    </div>
  `;
}

function retake(){
  if(!confirm('Clear your answers and retake the practice exam?')) return;
  state.answers = {};
  state.submitted = false;
  state.examStart = null;
  state.timed = null;
  state.view = 'exam';
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

<script>
// Same robust Lucide refresh as the other kits. Strips data-lucide from output
// and pauses the observer during refresh so it never loops.
function grainRefreshIcons(){
  if(!window.lucide) return;
  if(window._grainObs) window._grainObs.disconnect();
  lucide.createIcons();
  document.querySelectorAll('svg[data-lucide]').forEach(function(s){ s.removeAttribute('data-lucide'); });
  if(window._grainObs) window._grainObs.observe(document.body,{childList:true,subtree:true});
}
(function(){
  function init(){
    grainRefreshIcons();
    if(window.MutationObserver && !window._grainObs){
      window._grainObs=new MutationObserver(grainRefreshIcons);
      window._grainObs.observe(document.body,{childList:true,subtree:true});
    }
  }
  init();
  if(typeof window.lucide==='undefined'){
    var n=0, t=setInterval(function(){ if(window.lucide||++n>60){ clearInterval(t); init(); } },50);
  }
})();
