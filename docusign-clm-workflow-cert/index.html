<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docusign CLM Workflow Pro Prep · Analyst Prep Kit</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/docusign-clm-workflow-cert/">
<meta name="description" content="Prep for the Docusign CLM Workflow Pro exam. An area-by-area study guide of the CLM Workflow Designer, variables and XML, the generation and signature steps, triggers and service limits, plus a 44-question practice exam graded against the real 80% pass mark.">

<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}

<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Back to all kits">← All Kits</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Docusign CLM Workflow Pro Prep</span>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dsclmwfcert';
const EXAM_MINUTES = 50;   // Docusign estimates ~50 min. The real exam has NO time limit.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared Anthropic key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? 'Key saved. Hints are on.' : 'Key cleared.');
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = 'Add your Anthropic API key on the home page under Hints to turn hints on.'; return; }
  el.textContent = 'Thinking…';
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || 'Request refused. Check your key.'; return; }
    el.textContent = data.content?.[0]?.text || 'No response. Check your key.';
  } catch(e){ el.textContent = 'Request failed. Check your key and your connection.'; }
}
const TUTOR_ROLE = `You are a plain-spoken Docusign CLM tutor helping someone study for the Docusign CLM Workflow Pro exam. That exam covers administering Docusign CLM workflows: the workflow designer, workflow steps (automated document management, human, engine, integration, scheduling and communication), variables and the Params XML, XPath and C# expressions, document generation and eSignature steps, how workflows are started, service limits, error handling and publishing. It is about Docusign CLM, NOT CLM.CM (the older SpringCM platform).`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what the exam is likely to ask about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : '(no answer)');
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:'Workflow Designer fundamentals: canvas, steps, versions, publishing',
    must:[
      `<strong>Where workflows live.</strong> Select <em>Admin</em> in the navigation header, then <em>Workflows</em> under <strong>Automation Tools</strong>. The Workflows page has two tabs: <strong>Configuration</strong> (the designs) and <strong>Activity</strong> (the running and finished instances). <em>New Workflow</em> offers <em>Advanced Workflow</em> or <em>Use a Template</em>.`,
      `<strong>A workflow name holds 100 alphanumeric characters.</strong> A workflow <em>variable</em> name holds <code>250</code>. Two different limits, and the exam likes to swap them.`,
      `<strong>Five answers to "What type of content will kick off this workflow?"</strong>: <em>A document generation configuration</em>, <em>A document</em> (created, edited or uploaded), <em>Custom XML</em>, <em>A folder</em>, and <em>This workflow will start without content</em>. Pick the last one and the incoming content variable (<code>Params</code>) is empty.`,
      `<strong>The designer is English only.</strong> Docusign says to keep the <em>Default Account Language</em> account setting on English when using the workflow designer. Other languages might cause problems with workflows.`,
      `<strong>Building on the canvas.</strong> The <strong>Start</strong> step is already on the canvas when the designer opens. You search the <em>Add Steps</em> list, drag a step onto the canvas, select a step and drag a line to the next one, then set each step's fields in the <strong>Step Properties</strong> panel on the right.`,
      `<strong>Every connecting line carries a condition.</strong> Select the arrow and choose from <em>Follow this link if last action output is</em>, for example <code>Success</code>. Steps route by their last action output, and each step type has its own list of outputs.`,
      `<strong>The Start step has three settings worth knowing</strong>: <em>Workflow Name</em>, <em>Send a notification when workflow encounters an error</em> (with <em>Users To Receive Notification</em>), and <em>Track and record workflow activity</em> for reporting.`,
      `<strong>Finish is not decoration.</strong> The Finish step tells the engine where the workflow successfully concludes. It must be present and reached to resume a waiting parent workflow. Without it, a workflow that stops at a failed step shows as <em>Complete</em> in the activity monitor. You can have more than one Finish step.`,
      `<strong>Saving is not publishing.</strong> <em>Save your changes</em> gives you an unpublished workflow on the Configuration tab. To run it, select the <em>Create and publish versions</em> button, and on the <strong>Versions and Publishing</strong> panel select <em>Publish</em> for the version you are working on. It then shows a <em>Published</em> status.`,
      `<strong>Starting one by hand.</strong> On the Configuration tab, tick the box next to a published workflow and select <em>Start Workflow</em>. You can choose a document to kick it off, or select <em>PROVIDE CUSTOM PARAMETERS</em> and paste parameters. The instance then appears on the Activity page.`,
      `<strong>Clone = Export JSON, Import JSON.</strong> Open the design, select <em>Export</em> and <em>Export JSON</em>, create a new Advanced Workflow, select <em>Import</em>, pick the file, give it a new name and save. Changes to the clone never touch the original. The UAT to Production move uses the exact same export and import.`,
      `<strong>Deleting is gentle.</strong> When you delete a workflow, in-progress instances complete without error. Only after they finish is the workflow gone from the account.`,
      `<strong>Step Name and Step Description.</strong> Every step gets an automatically unique Step Name, and Docusign recommends keeping the default. The Step Description shows below the step on the canvas <em>and</em> in the process monitor, which is why it matters for troubleshooting.`,
      `<strong>Five families of steps</strong>: <em>automated document management</em> (create, move, email, lock, attribute documents), <em>human</em> (tasks on a Tasks page), <em>engine</em> (variables, loops, decisions, sub-workflows), <em>integration</em> (Salesforce, REST, eSignature API), and <em>scheduling and communication</em> (timers, reminders, emails).`,
      `<strong>Lane, Pool and Group are not steps.</strong> They are visual aids that draw a labeled, resizable, colored box on the canvas. They do nothing at run time. A Lane can sit inside a Pool.`,
      `<strong>Six workflow templates</strong>: Internal Approval, Start Another Process, Edit Document, Negotiation, Routing, and Signature. They are for "administrators and full subscribers with workflow privileges", they can be opened in the designer for detailed customization, and their trigger choice is <em>Skip for now</em> or <em>Document Generation</em>.`,
      `<strong>The Activity page is the process monitor.</strong> Filter by <em>Workflow</em>, <em>Last Updated</em> and <em>Workflow Status</em>, then select a workflow name to open it. The Workflow Information panel shows <em>Total Activities Executed</em>, and the <em>Variables &amp; Values</em> list shows every variable, including the caret ones.`,
      `<strong>Search inside a big design.</strong> The designer can search for steps, groups or lanes by name, so the answer to "how do I find one step in a 200-step workflow" is the designer's own search, not the Activity filter.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "I saved it, so it will run." Saving creates an <em>unpublished</em> workflow. Nothing that starts a workflow (a smart rule, a document generation configuration, a Salesforce Flow, a custom action, the Start Workflow dialog) can use it until a version is published. The Salesforce Flow action goes further and needs the <em>exact</em> name of an <em>active</em> workflow. When a question says "the workflow never starts", look for the word published first.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px">

  {key:'d2', title:'Data in workflows: variables, Params XML, XPath, expressions',
    must:[
      `<strong>Variables are containers.</strong> There are three kinds: variables <em>you create</em>, <strong>system</strong> variables that capture data about the instance, and <strong>caret</strong> variables that CLM creates when an action occurs. Docusign's advice: keep the number of variables small and use XML variables to hold several data points at once.`,
      `<strong>Params is the incoming content.</strong> It stores whatever triggered the workflow. The default name is <code>Params</code> and you may rename it. The rule the exam wants: <strong>do not modify Params</strong>. Copy it to another variable and work on the copy, so the original trigger data stays intact for debugging.`,
      `<strong>Params from document generation</strong> carries the form's values in a node called <code>TemplateFieldData</code>. The Params schema is only populated after an associated document generation configuration has triggered the workflow once. Docusign's method: build an <em>empty</em> workflow, connect it to the configuration, run it once, then copy the XML into the real workflow.`,
      `<strong>The simple variable types</strong>: <em>Date</em>, <em>Number</em> (must be an integer, usable directly in C# expressions), <em>Text</em>, and <em>ID List</em> (just the IDs of many documents or folders, which keeps the variable small). An <em>Iterator</em> points to a repeating node inside another XML variable.`,
      `<strong>The XML-type variables</strong>: <em>Actor</em> (a CLM user, with a predefined schema: name, email, user ID), <em>Custom XML</em> (any structure; paste or upload XML to define the schema, or define nodes one at a time), <em>Document</em>, and <em>Folder</em>. Find Document stores into a Document variable; Find Folder into a Folder variable.`,
      `<strong>Naming rules Docusign states outright.</strong> Use a succinct, meaningful name. Capitalize the first letter of every word. Use whole words, no abbreviations. A variable name can be up to <code>250</code> alphanumeric characters.`,
      `<strong>Four system variables</strong>: <code>&lt;%#System.Link%&gt;</code> (a task link unique to the instance), <code>&lt;%#System.Date%&gt;</code>, <code>&lt;%#System.Time%&gt;</code> (both by server locale), and <code>%#System.Uid%</code>, the instance ID. Docusign says to always include the Uid in emails about failures or errors. To see the list, export the workflow as JSON.`,
      `<strong>Caret variables start with ^.</strong> CLM creates them when an action completes, for example <code>^Find Document 1DocumentIds</code> after a Find Document step finds one document. They appear in the Variables &amp; Values list on the Activity page. Expressions can read them: <code>GetVariableValue("^Approve 1Comments")</code>.`,
      `<strong>Update Variable Value has three outputs</strong>: <em>Updated</em>, <em>Not Updated</em> and <em>Failed</em>. Its data lives only inside the one instance. To get data out you start a sub-workflow with the <em>Workflow</em> step, use <em>Update Parent Variable</em> from the child (that step can only be used in a child workflow), or use <em>Set Workflow Output</em>. You cannot use Update Variable Value on system variables, caret variables, or Params.`,
      `<strong>Evaluate an xPath</strong> runs an XPath expression against a variable (Params, a document XML, a folder XML, anything with an XML schema) and returns one of four result types: <em>Boolean</em>, <em>Number</em> (Double), <em>String</em>, or <em>Node Set</em>. Docusign's own example: <code>//ScorecardElement[./Topic/text()='Indemnification' and ./RiskLevel/text()='High']</code>.`,
      `<strong>Three ways to load a variable from a file.</strong> <em>Update Variable From XML</em> uses an XPath to pull a node from an XML file in CLM. <em>Update Variable from CSV</em> looks up a row by a column value (the lookup column should be unique; if not, the first match wins). <em>Create Variable from CSV</em> ingests a whole CSV into a Custom XML variable: the CSV must be in a CLM folder, have a header row and at least two columns, stay under <code>1 MB</code>, and the variable it creates cannot exceed <code>5 MB</code>.`,
      `<strong>Expressions are C#.</strong> You open the Expression Builder from the icon next to a field, type in the C# Input field, and <em>Save</em> validates it. Only namespaces on Docusign's allowlist may be used. Read a non-XML variable with <code>GetVariableValue("name")</code> and an XML variable with <code>_context.XmlVariables["name"].ValueString</code>.`,
      `<strong>Current Date beats DateTime.Now.</strong> <em>Current Date</em> gives the date in your account's time zone. <em>DateTime.Now</em> gives the time of the machine running the expression, with no guaranteed time zone. Use DateTime.Now only when the time of day matters, and <em>DateTime.UtcNow</em> plus a conversion when you need a specific zone.`,
      `<strong>Do not write an expression for a job a field can do.</strong> Docusign's best practice: replace expressions that only call GetVariableValue or concatenate strings by dropping variables straight into the field, for example <code>&lt;%#Variable.SubmittedBy%&gt;</code>. Combine expressions that work on the same data. Every expression counts against the 300-per-15-minute limit.`,
      `<strong>Decision vs Rule.</strong> A <em>Rule</em> evaluates one condition and outputs <em>True</em> or <em>False</em>. A <em>Decision</em> takes several <em>If</em> conditions, each with its own named output string, plus an <em>Else</em> default path. A Routing task is "commonly followed by a Decision step".`,
      `<strong>The loop steps.</strong> <em>For Loop</em> counts a variable up by 1 each cycle until it matches <em>Number of loops</em>. <em>For-Each Loop</em> iterates an Iterator over XML, serial by default or parallel, with outputs <em>Step</em>, <em>Loop End</em> and <em>Failure</em>. <em>Next Loop</em> is an optional visual end marker. It is not required, but it still counts toward the activity limit.`,
      `<strong>Find steps have four outputs, and Success is the trap.</strong> Find Documents by Folder and Find Documents by Metadata return <code>50</code> documents by default and up to <code>200</code>. Their outputs are <em>Success</em> (ran without error, found or not), <em>Failure</em>, <em>Match</em> (at least one found) and <em>No Match</em>. Find Party also returns up to 200. Find User can only store into an Actor variable.`,
      `<strong>Update Document Metadata Value has two methods.</strong> <em>Choose attribute</em> sets attributes one at a time. <em>XML</em> takes one payload for bulk updates and deletions: it starts with <code>&lt;UpdateMetadata UpdateType="Patch"&gt;</code> or <code>"Put"</code> (PATCH is the default), and <code>Delete="true"</code> only works under PATCH. XML updates cover custom attributes only; standard attributes such as Party go through <em>Edit CLM Agreement Attributes</em>.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "If the Find step took the Success path, it found something." Success on Find Documents by Folder means the step ran without error, whether or not a document came back. The paths that say anything about results are <em>Match</em> and <em>No Match</em>. A workflow that routes on Success and then tries to use the found document is the classic "works in testing, fails on an empty folder" bug.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Created</b> <span style="color:var(--dim);font-size:13px">Date, Number, Text, ID List, Iterator, Actor, Custom XML, Document, Folder</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>System</b> <span style="color:var(--dim);font-size:13px">System.Link, Date, Time, Uid</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Caret ^</b> <span style="color:var(--dim);font-size:13px">made by a completed step</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Params is the created one you never edit in place.</div>`},

  {key:'d3', title:'Generation, review and signature steps',
    must:[
      `<strong>Human steps become tasks on the assignee's Tasks page, and the roster is</strong>: Approve, Choice, Choose Documents, Choose Users, Create or Upload Doc, Data Reconciliation, Edit Document, Edit Form, Fill Form, Full Page Edit Form, Review and Send for External Review, Review and Send for Signature, Review Data, and Routing. If a question's step name is not on this list, it is probably an automated step.`,
      `<strong>Approve routes on the decision.</strong> The assignee's approve or reject choice becomes the step's output path. The button labels are customizable (defaults <em>Approve</em> and <em>Reject</em>), and Comments can be required, optional or omitted. A <em>Stage Name</em> feeds the Workflow Steps report; a <em>Display Name</em> is what the user sees in the Task Name column.`,
      `<strong>Assignment has three dials.</strong> Assign to a user or to a task group. For several people, <em>Any one assignee</em> completes the task on the first response, while <em>All of the assignees</em> waits for everyone. <em>Assign tasks in order</em> hands it to the first person, then the next.`,
      `<strong>A task group is a collection of users who share a task list.</strong> Members can be given seven permissions: Task Group Owner, View Task Group, View Allocated Item, Ad Hoc Pick Task (claim), Can Do User Based Allocation (reallocate), Put Back in Task Group, and Automatic Dispatch (let workflows auto-assign to this member). Leave the Task Group Assignee blank and the task is available to the whole group.`,
      `<strong>Due dates: 0 to 999 units of months, weeks, days, hours or minutes</strong>, with up to five extra increments. If you set a due date you should also wire the <em>Timeout - Action</em> path, because that is where the step goes when nobody acts.`,
      `<strong>A business day is 8 hours.</strong> With <em>Use business days only</em>, "1 day" (24 hours) becomes three business days. To make a task due two business days later, set the timeout to <code>16 hours</code>. A setting of 2 days and 8 hours becomes 7 business days.`,
      `<strong>When the first reminder fires.</strong> With <em>Send reminder after execution</em> selected, the first reminder goes out that long <em>after the task is created</em>. Without it, it goes out that long <em>before the due date</em>. No due date at all, and it fires after the First Reminder interval from creation. A reminder runs on a parallel thread; the task stays pending.`,
      `<strong>Choice vs Routing.</strong> Both ask a person to pick a path. Choice has a fixed list of options you type in. Routing can fill its options from a comma- or pipe-delimited list built in the expression builder, so the choices can be dynamic. Both steps' <em>Link to next step</em> option only works when the next human step is assigned to the same user, and must not be enabled on the last human step.`,
      `<strong>Step cancellation.</strong> Tick <em>Enable Step Cancellation</em> on a human step and a <em>Step Cancelled</em> output appears. You must connect it, or cancellation can fail the workflow. The cancellable steps are Approve, Choice, Edit Document, Review and Send for External Review, Review and Send for Signature, Review Data and Routing. A user cancels from Document Review with <em>Cancel Current Step</em> on the Activity tab. Open tasks under the step are cancelled, a checked-out document is checked in, and completed tasks are untouched.`,
      `<strong>Who may cancel.</strong> The step's own authorized users or task groups, or anyone holding a delegated permission that includes <em>Workflow Step Cancellation</em>. A separate trick for Choose Users and Choose Documents: enable the <em>ActionRejected</em> output and a Cancel button appears on the task, routing wherever you pointed that line.`,
      `<strong>Document Generation is an automated step.</strong> You name an existing <em>Document Generation Configuration</em> and the <em>Template</em> inside it, optionally a Salesforce Object Id, and feed data either as <em>Update Value(s)</em> pairs or an input XML variable. Its outputs are <em>Success</em>, <em>Conditional Success</em> and <em>Failure</em>.`,
      `<strong>Two signature senders, one waiter.</strong> <em>Send for Signature</em> is automatic. <em>Review and Send for Signature</em> is a human task where the user prepares the envelope. <strong>Wait for Signature must be used with Review and Send for Signature, and must not be used with Send for Signature.</strong> Both senders accept DOC, DOCX and PDF, and recipients do not have to be CLM users.`,
      `<strong>Signature step rules that fail silently in the wild.</strong> If a recipient in the To field also appears in an applied envelope template, the step fails. <em>Expiration Days</em> tops out at <code>180</code>. A <em>Signer Password</em> is optional. The eSignature <em>Send Later</em> option is not compatible with Review and Send for Signature, and a long envelope prep can hit the CLM <em>Idle Session Timeout</em>.`,
      `<strong>Documents, Documents and Templates, Envelope Template.</strong> Plain <em>Documents</em> sends files with no template. <em>Documents and Templates</em> applies an envelope template's metadata (recipients, message) to each document but not the template's documents. The <em>Envelope Template</em> field applies settings, recipients <em>and</em> documents from the template to everything selected. Templates must already exist in the eSignature account.`,
      `<strong>Wait for Signature watches audit events</strong>: None, Sent, Viewed, Signed, Rejected, Delegated, EmailBounced, Sealed. Its outputs are Cancelled, Signed, Rejected, Updated, Failure and Timed Out. <em>Cancel Electronic Signature</em> is the separate automated step that withdraws a request.`,
      `<strong>Email vs Email Document.</strong> <em>Email</em> (a scheduling and communication step) sends a message with From, To, CC, BCC, Subject and Body, and the subject and body can be expressions. <em>Email Document</em> (an automated document step) attaches documents, sends them as <em>Native</em> or <em>PDF</em>, allows <code>50</code> recipients and <code>20.48 MB</code> of attachments, and can add the sender's CLM signature from My Preferences.`,
      `<strong>Review Data</strong> assigns up to <code>50</code> attributes to one user or one task group to review and populate in a task. Supported: Party, Type, Value, Effective Date, Expiration Date, and custom Number, Decimal, Date, Dropdown, Dynamic Dropdown and Cascading Dropdown. Not supported: Actor and Autonumber attributes. The AI data-extraction steps require a Review Data step in the same workflow.`,
      `<strong>Update Security</strong> sets a user's access on documents or folders: Inherit from Parent Folder, No Access, View, View &amp; Create, View &amp; Edit, View, Edit &amp; Delete, View, Edit, Delete &amp; Set Access, or a Security Variable. Docusign's best practices: select <em>Wait for the update to complete</em>, assign to groups not users, skip administrators (they already have full access), avoid duplicate rules, and apply security right after creating a folder.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Send for Signature, then Wait for Signature." Docusign's doc is blunt: Wait for Signature pairs with <em>Review and Send for Signature</em> and must not be used with <em>Send for Signature</em>. The automatic sender already tracks the envelope through its own output path. Put the waiter after the wrong sender and the workflow sits there.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Send for Signature</b> <span style="color:var(--dim);font-size:13px">automatic, no task</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Review and Send for Signature</b> <span style="color:var(--dim);font-size:13px">human task, then ↓</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf);border-color:var(--accent)"><b>Wait for Signature</b> <span style="color:var(--dim);font-size:13px">only after the human one</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Same pattern for external review: an automatic sender, a human sender, one waiter.</div>`},

  {key:'d4', title:'Starting workflows, limits and administration',
    must:[
      `<strong>Every way a published workflow starts.</strong> By hand from the Configuration tab. From a <em>smart rule</em> whose action is <em>Start Workflow</em>. From a <em>document generation configuration</em> linked to it. From an eSignature <em>Agreement Action</em> set to Start Workflow. From a Salesforce Flow's <em>Start Docusign CLM Workflow</em> action. From a CLM Files <em>custom action</em>. From a parent workflow's <em>Workflow</em> step. Or it waits mid-stream for an API call with <em>Wait for Signal</em>.`,
      `<strong>The smart rule Start Workflow action</strong> is valid with <em>Document Events</em> and <em>Scheduled Events</em>, and it needs "a previously defined and published advanced workflow". Docusign's sample rule: event <em>Document Added</em>, <em>Execute As: Specified User</em>, filters on subfolder and name like "NDA", action <em>Start Workflow</em>.`,
      `<strong>Salesforce Flow</strong> needs Docusign Apps Launcher 6.3 or higher. The action takes a <em>Record Id</em> and a <em>Workflow Name</em>, and the name must be the exact name of an active CLM workflow. A misspelling or an inactive workflow means Salesforce cannot trigger it. The older route is a custom button on a page layout.`,
      `<strong>A CLM Files custom action</strong> is built in Admin under <em>Navigation &amp; Actions</em>, customizing <em>CLM Files Actions</em>. Its <em>What should this action do?</em> is <em>Start workflow</em>, and it can pass the selected document IDs and the triggering user's ID into the workflow.`,
      `<strong>Agreement Actions hand envelope data to a workflow as custom XML.</strong> You then pull fields out with Evaluate an xPath, for example the recipient name at <code>/Params/envelope/recipients/signers/item/name/text()</code> or the first document's name at <code>/Params/envelope/envelopeDocuments/item[order/text()=1]/name/text()</code>.`,
      `<strong>The 300-expression limit pauses, it does not fail.</strong> A workflow instance may evaluate <code>300</code> expressions in any 15-minute window. Over that, CLM pauses the instance and emails the users in the <em>Advanced Workflow Error Notification User</em> account setting. If nobody acts before the scheduled purge day, the workflow is aborted and purged. It applies to new revisions created from August 12, 2025 (UAT) and September 2, 2025 (Production).`,
      `<strong>The activity limit is 10,000 per instance</strong> for revisions published after April 28, 2022 (UAT) and May 13, 2022 (Production); older revisions keep 100,000. Every executed step is one activity, including Next Loop. Over the limit the instance is paused and given a purge date, and only Docusign Support can raise it. Separately, no more than <code>5,000</code> activities can run consecutively without a human or asynchronous step.`,
      `<strong>Executing or Paused has a shelf life.</strong> 365 days in Production and 90 days in UAT, then CLM aborts the revision and schedules the purge. A workflow that the system paused for hitting any limit begins purging 30 days after the pause.`,
      `<strong>The purge schedule is an account setting.</strong> <em>Days after Workflow Completes</em> and <em>Days after Workflow Fails</em> both accept <code>7</code> to <code>30</code> and default to <code>7</code>. <em>Delay purge for workflows with sub-workflows</em>, under the Workflow &amp; Tasks settings, keeps parent, child and sibling data until the last one finishes.`,
      `<strong>Throughput per account.</strong> Workflows started per hour: <code>100</code> in UAT, <code>1,000</code> in Production. Executions per 15 minutes: <code>500</code> in UAT, <code>12,000</code> in Production. An execution is counted when a workflow starts <em>or</em> resumes from an asynchronous step such as sending for signature.`,
      `<strong>Size limits.</strong> One variable: <code>5 MB</code>. All variables in one workflow: <code>25 MB</code>. Output of one expression evaluation: <code>1 MB</code>. The UI shows at most <code>1,000</code> executed steps for a workflow.`,
      `<strong>Redacting sensitive values.</strong> On a variable, tick <em>Do not display variable value</em> and the process monitor shows <em>Redacted</em> in Step Information and Variables &amp; Values. It does not redact data passed by Update Parent Variable, and a logged expression still shows its variable data. Docusign warns that needless redaction hurts Support's troubleshooting.`,
      `<strong>UAT to Production is export and import.</strong> Export JSON from UAT, import it into a new workflow in Production, rename, save, repoint any Maestro Workflow steps to Production Workflow Builder workflows, then publish and start. Workflow Builder names must be unique in Production or the call fails.`,
      `<strong>Child workflows and aborted parents.</strong> If a parent fails or aborts, a child waiting on an asynchronous step (such as Wait for Signature) gets aborted when CLM checks it, roughly 24 hours after the activity's last processing date. A child that finishes before the check survives.`,
      `<strong>Three housekeeping steps.</strong> <em>Logger</em> writes a message into the workflow monitor. <em>Update Information</em> sets the Info column on the Tasks and Workflow Activity pages. <em>Set Workflow Process Name</em> names the process on the Workflow Steps report, and only needs setting in the parent.`,
      `<strong>The integration steps</strong>: Http Client (outbound HTTPS/REST), Invoke Web Service, Salesforce ETL (real-time Salesforce data into XML), Update Salesforce (modeled on SOQL), Create New Salesforce Object, Add Salesforce Task, Add Salesforce Activity History, Excel ETL, Connections (NetSuite and Workday Financials connectors, added first on the Connections page), and Maestro Workflow (triggers a Workflow Builder workflow).`
    ],
    miscon:`<strong>Misconception to bust:</strong> "A paused workflow has failed." Paused is CLM's response to a service limit: too many expressions, too many activities. The instance is alive, an email goes to the Advanced Workflow Error Notification users, and Support can lift the activity limit so you can resume it. What turns a pause into a real loss is doing nothing, because a limit-paused workflow starts purging 30 days later.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>300</b> <span style="color:var(--dim);font-size:13px">expressions / 15 min, then paused</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>10,000</b> <span style="color:var(--dim);font-size:13px">activities per instance, then paused</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>365 / 90</b> <span style="color:var(--dim);font-size:13px">days Executing or Paused (Prod / UAT), then aborted</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>7 to 30</b> <span style="color:var(--dim);font-size:13px">days to purge, default 7</span></div>
    </div>`}
];

/* ============== PRACTICE EXAM: 44 questions ==============
   d1: 11 · d2: 13 · d3: 13 · d4: 7
   The real Pro exam is 40 multiple-choice items at 80% to pass, with no time limit.
   Every answer traces to the Docusign CLM Workflows guide (bundleId yks1643320936212),
   the CLM Admin guide service limits page, the Smart Rules guide or the CLM for Salesforce guide.
   type 'mc' → correct: index · type 'ms' → correct: [indices] (choose all that apply) */
const QUESTIONS = [
  /* ---------- AREA 1 · Workflow Designer fundamentals (11) ---------- */
  {id:'q1', domain:'d1', type:'mc', q:`What is the maximum length of a workflow name in Docusign CLM?`,
    choices:[`50 alphanumeric characters`, `100 alphanumeric characters`, `250 alphanumeric characters`, `255 characters`],
    correct:1,
    explain:`Workflow names are limited to <strong>100</strong> alphanumeric characters. The 250 figure is the limit for a workflow <em>variable</em> name.`},
  {id:'q2', domain:'d1', type:'ms', q:`Which options appear under "What type of content will kick off this workflow?" when creating an Advanced Workflow? <em>Choose all that apply.</em>`,
    choices:[`A document generation configuration`, `Custom XML`, `A smart rule`, `This workflow will start without content`],
    correct:[0,1,3],
    explain:`The five choices are a document generation configuration, a document, custom XML, a folder, and start without content. A smart rule is a way to <em>trigger</em> a workflow, not a kick-off content type.`},
  {id:'q3', domain:'d1', type:'mc', q:`An administrator chooses "This workflow will start without content". What is true about the Params variable?`,
    choices:[`It holds the folder that started the workflow`, `It is empty`, `It is removed from the workflow`, `It holds the user who started the workflow`],
    correct:1,
    explain:`Docusign's wording: if you choose this option, your incoming content (Params) variable is empty. The variable still exists; it just has nothing in it.`},
  {id:'q4', domain:'d1', type:'mc', q:`A workflow has no Finish step. It stops at an Approve step because of a failure. What does the activity monitor show?`,
    choices:[`Failed`, `Paused`, `Complete`, `Aborted`],
    correct:2,
    explain:`Without a Finish step the workflow shows as <strong>Complete</strong> even though it did not finish. The Finish step is what lets the engine highlight errors and resume a waiting parent.`},
  {id:'q5', domain:'d1', type:'mc', q:`After editing a workflow, what must happen before the changes can execute?`,
    choices:[`Select Save your changes; saving makes the version live`, `Open the Versions and Publishing panel and select Publish for the version`, `Start the workflow from the Activity tab`, `Export the workflow as JSON and re-import it`],
    correct:1,
    explain:`Saving leaves you with an unpublished workflow. The <em>Create and publish versions</em> button opens the Versions and Publishing panel, where you select Publish and the version shows a Published status.`},
  {id:'q6', domain:'d1', type:'mc', q:`How do you create a copy of an existing workflow design so you can change it for a different purpose?`,
    choices:[`Select Clone on the Configuration tab`, `Export the design as JSON, create a new Advanced Workflow, and import the JSON`, `Select Save As in the designer toolbar`, `Publish a new version of the original and rename it`],
    correct:1,
    explain:`Cloning is export and import: Export JSON from the original, New Workflow, Advanced Workflow, then Import the file and give it a new name. The same mechanism moves a workflow from UAT to Production.`},
  {id:'q7', domain:'d1', type:'mc', q:`What happens to in-progress instances when an administrator deletes a workflow?`,
    choices:[`They are aborted immediately`, `They complete without error, and then the workflow is no longer available`, `They are paused until the workflow is restored`, `They are purged on the next purge day`],
    correct:1,
    explain:`Deleting a workflow lets in-progress instances complete without error. The workflow disappears from the account after they finish.`},
  {id:'q8', domain:'d1', type:'mc', q:`Which setting is found on the Start step of an advanced workflow?`,
    choices:[`Send a notification when workflow encounters an error`, `Days after Workflow Fails`, `Use business days only`, `Wait for the update to complete`],
    correct:0,
    explain:`The Start step holds the Workflow Name, the error notification checkbox with its Users To Receive Notification list, and Track and record workflow activity. The purge days are account settings; business days belong to human steps; the wait option belongs to Update Security.`},
  {id:'q9', domain:'d1', type:'mc', q:`Which of these is NOT a functional workflow step?`,
    choices:[`Logger`, `Lane`, `Timer Trigger`, `Rule`],
    correct:1,
    explain:`Lane, Pool and Group are visual aids that label sections of the canvas. Docusign states they are not functional workflow steps. Logger, Timer Trigger and Rule all execute.`},
  {id:'q10', domain:'d1', type:'mc', q:`How many predefined workflow templates does Docusign CLM provide, and which of these is one of them?`,
    choices:[`Four, including Bulk Import`, `Six, including Negotiation`, `Six, including Smart Rule`, `Eight, including Data Reconciliation`],
    correct:1,
    explain:`Six templates: Internal Approval, Start Another Process, Edit Document, Negotiation, Routing and Signature. Data Reconciliation is a human step, not a template.`},
  {id:'q11', domain:'d1', type:'mc', q:`Where do you read the number under "Total Activities Executed" for a running workflow?`,
    choices:[`The Configuration tab, in the workflow's row`, `The Workflow Information panel after opening the workflow from the Activity page`, `The Versions and Publishing panel`, `Account Settings under Workflow &amp; Tasks`],
    correct:1,
    explain:`Open Admin, Workflows, filter the Activity list if needed, select the workflow name, and read Total Activities Executed on the Workflow Information panel. A paused-for-limit workflow shows a message under Status.`},

  /* ---------- AREA 2 · Data: variables, XML, XPath and expressions (13) ---------- */
  {id:'q12', domain:'d2', type:'mc', q:`What does Docusign say you should do with the Params variable when you need to manipulate its data?`,
    choices:[`Edit it in place with Update Variable Value`, `Copy it to a new variable and manipulate the copy`, `Rename it first, then edit it`, `Convert it to JSON first`],
    correct:1,
    explain:`Do not modify your Params content. Retain the exact data that triggered the workflow for debugging, and work on a copy.`},
  {id:'q13', domain:'d2', type:'mc', q:`A workflow is triggered by document generation. Which node inside Params holds the values the user typed into the form?`,
    choices:[`<code>FormValues</code>`, `<code>TemplateFieldData</code>`, `<code>envelope</code>`, `<code>MetadataGroups</code>`],
    correct:1,
    explain:`For document generation triggers, a node called <strong>TemplateFieldData</strong> contains the populated form fields. <code>envelope</code> is what an eSignature Agreement Action sends; <code>MetadataGroups</code> is the bulk metadata update schema.`},
  {id:'q14', domain:'d2', type:'ms', q:`Which of these are XML-type variables in a Docusign CLM workflow? <em>Choose all that apply.</em>`,
    choices:[`Actor`, `Folder`, `Number`, `Custom XML`],
    correct:[0,1,3],
    explain:`Actor, Custom XML, Document and Folder are the XML-type variables. Number is a simple variable and its input must be an integer.`},
  {id:'q15', domain:'d2', type:'mc', q:`Which variable holds only the IDs of many documents or folders, keeping the stored result small?`,
    choices:[`Iterator`, `ID List`, `Document`, `Text`],
    correct:1,
    explain:`An ID List variable stores just the IDs, for example the result of Find Documents by Folder when you do not need the full document XML. An Iterator points to a repeating node in another XML variable.`},
  {id:'q16', domain:'d2', type:'mc', q:`Which system variable does Docusign say to always include in emails that notify users about failures or errors?`,
    choices:[`<code>&lt;%#System.Link%&gt;</code>`, `<code>&lt;%#System.Date%&gt;</code>`, `<code>%#System.Uid%</code>`, `<code>&lt;%#System.Time%&gt;</code>`],
    correct:2,
    explain:`System.Uid is the workflow instance ID, and Docusign says to always include it in failure or error emails. System.Link is the task link, which is unique per instance and different in a child workflow.`},
  {id:'q17', domain:'d2', type:'mc', q:`A variable named <code>^Find Document 1DocumentIds</code> appears in the Variables &amp; Values list. What created it?`,
    choices:[`An administrator, using the Variables tab`, `Docusign CLM, when a Find Document step completed`, `The Params schema from document generation`, `The Export JSON action`],
    correct:1,
    explain:`Variables that start with a caret (^) are created by CLM when an action occurs. This one records that a Find Document step located one document ID.`},
  {id:'q18', domain:'d2', type:'mc', q:`Which step can be used only inside a child (sub) workflow?`,
    choices:[`Set Workflow Output`, `Update Parent Variable`, `Update Variable Value`, `Resource Variable`],
    correct:1,
    explain:`Update Parent Variable changes a variable in the parent and "can be used only in a sub-workflow". Set Workflow Output also passes data up, but the restriction Docusign states is on Update Parent Variable.`},
  {id:'q19', domain:'d2', type:'ms', q:`Which result types can the Evaluate an xPath step return? <em>Choose all that apply.</em>`,
    choices:[`Boolean`, `Node Set`, `Actor`, `String`],
    correct:[0,1,3],
    explain:`Boolean, Number (Double), String and Node Set (XPathNodeIterator). Actor is a variable type, not an XPath result.`},
  {id:'q20', domain:'d2', type:'mc', q:`What is the maximum size of the CSV file used by the Create Variable from CSV step?`,
    choices:[`1 MB`, `5 MB`, `25 MB`, `200 MB`],
    correct:0,
    explain:`The CSV cannot exceed <strong>1 MB</strong>; the variable the step creates cannot exceed 5 MB. 25 MB is the total for all variables in a workflow, and 200 MB is the Combine Documents output cap.`},
  {id:'q21', domain:'d2', type:'mc', q:`Which expression reads the value of a non-XML workflow variable named ContractNumber?`,
    choices:[`<code>_context.XmlVariables["ContractNumber"].ValueString</code>`, `<code>GetVariableValue("ContractNumber")</code>`, `<code>Params.ContractNumber</code>`, `<code>System.Variables.ContractNumber</code>`],
    correct:1,
    explain:`<code>GetVariableValue("name")</code> is for non-XML variables. The <code>_context.XmlVariables[...].ValueString</code> form is for XML variables.`},
  {id:'q22', domain:'d2', type:'mc', q:`An expression needs today's date in the account's time zone and does not care about the time of day. Which should it use?`,
    choices:[`<code>DateTime.Now</code>`, `Current Date`, `<code>DateTime.UtcNow</code>`, `<code>System.Time</code>`],
    correct:1,
    explain:`Current Date produces the date for the account's time zone. DateTime.Now gives the time of the machine running the expression with no guaranteed zone, so Docusign recommends it only when the time of day matters.`},
  {id:'q23', domain:'d2', type:'mc', q:`What are the outputs of a Rule step?`,
    choices:[`Success and Failure`, `True and False`, `Match and No Match`, `A named output per condition plus Else`],
    correct:1,
    explain:`A Rule evaluates one condition and outputs True or False. The named outputs plus Else describe the Decision step.`},
  {id:'q24', domain:'d2', type:'mc', q:`Find Documents by Folder runs on an empty folder with no errors. Which output paths does it follow?`,
    choices:[`Failure only`, `No Match only`, `Success and No Match`, `Success and Match`],
    correct:2,
    explain:`Success is followed whenever the step runs without error, regardless of whether a document was returned. No Match is followed when nothing was found. Route on Match or No Match when the result matters.`},

  /* ---------- AREA 3 · Generation, review and signature steps (13) ---------- */
  {id:'q25', domain:'d3', type:'mc', q:`A task is assigned to three users with "Any one assignee" selected. When is the task complete?`,
    choices:[`When all three respond`, `When the first of them responds`, `When the task group owner approves`, `When the due date passes`],
    correct:1,
    explain:`Any one assignee means a response from a single person completes the task. All of the assignees is the option that waits for everyone.`},
  {id:'q26', domain:'d3', type:'mc', q:`Which task group permission lets a member claim a task that is assigned to the group?`,
    choices:[`Automatic Dispatch`, `Ad Hoc Pick Task`, `Put Back in Task Group`, `View Allocated Item`],
    correct:1,
    explain:`Ad Hoc Pick Task is "claim a task that is assigned to the task group". Automatic Dispatch lets workflows assign tasks to the member; Put Back in Task Group returns a task from an assignee to the group.`},
  {id:'q27', domain:'d3', type:'mc', q:`A step uses business days only. The administrator wants the task due two business days after assignment. What timeout value is correct?`,
    choices:[`2 days`, `48 hours`, `16 hours`, `6 days`],
    correct:2,
    explain:`CLM measures a business day as 8 hours, so 16 hours is two business days. "2 days" would be 48 hours, which the product reads as six business days.`},
  {id:'q28', domain:'d3', type:'mc', q:`A task has a 30-day due date, a 5-day First Reminder, and "Send reminder after execution" is NOT selected. When is the first reminder sent?`,
    choices:[`5 days after the task is created`, `25 days after the task is created`, `30 days after the task is created`, `Immediately`],
    correct:1,
    explain:`Without "Send reminder after execution", the reminder fires at the due date minus the first reminder interval: 5 days before day 30, which is 25 days after creation. With the option selected it would fire 5 days after creation.`},
  {id:'q29', domain:'d3', type:'mc', q:`Which human step can populate its options from a comma- or pipe-delimited list built in the expression builder?`,
    choices:[`Choice`, `Approve`, `Routing`, `Decision`],
    correct:2,
    explain:`Routing differs from Choice precisely here: its options can be determined dynamically from a delimited list. Decision is an engine step, not a human one.`},
  {id:'q30', domain:'d3', type:'mc', q:`An administrator enables step cancellation on an Approve step. What else must they do?`,
    choices:[`Nothing, cancellation routes to Finish automatically`, `Connect the new "Step Cancelled" output to a subsequent step`, `Add a Wait for Signal step after it`, `Give every assignee the CLM Admin profile`],
    correct:1,
    explain:`Enabling cancellation exposes a Step Cancelled output, and Docusign warns you must define the path to take after cancellation or the workflow could fail.`},
  {id:'q31', domain:'d3', type:'ms', q:`Which human steps can be cancelled with the step cancellation feature? <em>Choose all that apply.</em>`,
    choices:[`Approve`, `Review and Send for Signature`, `Fill Form`, `Routing`],
    correct:[0,1,3],
    explain:`The cancellable steps are Approve, Choice, Edit Document, Review and Send for External Review, Review and Send for Signature, Review Data and Routing. Fill Form is not on the list.`},
  {id:'q32', domain:'d3', type:'mc', q:`What are the output paths of the Document Generation step?`,
    choices:[`Success and Failure`, `Success, Conditional Success and Failure`, `Match and No Match`, `Generated, Uploaded and Failed`],
    correct:1,
    explain:`Document Generation has three step output paths: Success, Conditional Success and Failure.`},
  {id:'q33', domain:'d3', type:'mc', q:`Which step must Wait for Signature be paired with?`,
    choices:[`Send for Signature`, `Review and Send for Signature`, `Cancel Electronic Signature`, `Send for External Review`],
    correct:1,
    explain:`Docusign: you must use Wait for Signature with the Review and Send for Signature step, and must not use it with the Send for Signature step.`},
  {id:'q34', domain:'d3', type:'mc', q:`What is the maximum value for Expiration Days on a signature step?`,
    choices:[`30 days`, `90 days`, `120 days`, `180 days`],
    correct:3,
    explain:`Expiration Days tops out at 180. It sets how many days before the signature request expires.`},
  {id:'q35', domain:'d3', type:'mc', q:`A recipient listed in the To field of a Send for Signature step is also a recipient in the applied envelope template. What happens?`,
    choices:[`The recipient gets two emails and signs once`, `The step fails`, `The template recipient is ignored`, `The step waits for an administrator`],
    correct:1,
    explain:`If recipients in the To field are identical to recipients in any applied eSignature envelope template, the step fails. Duplicate emails are the warning for overlapping recipients across two templates, not this case.`},
  {id:'q36', domain:'d3', type:'mc', q:`Which step sends documents as attachments and allows up to 50 recipients?`,
    choices:[`Email`, `Email Document`, `Send for External Review`, `Update Information`],
    correct:1,
    explain:`Email Document attaches documents (Native or PDF), allows 50 recipients and 20.48 MB of attachments. The plain Email step sends a message without document attachments.`},
  {id:'q37', domain:'d3', type:'mc', q:`Which best practice does Docusign give for the Update Security workflow step?`,
    choices:[`Assign security to individual users for precision`, `Include administrators so their access is recorded`, `Select "Wait for the update to complete" so the security calculation finishes before the next step`, `Apply explicit security on every branch of the folder tree`],
    correct:2,
    explain:`The doc's first practice is to enable Wait for the update to complete. It also says to use groups not users, skip administrators (they already have full access), avoid duplicates, and let branches inherit from the root.`},

  /* ---------- AREA 4 · Starting workflows, limits and administration (7) ---------- */
  {id:'q38', domain:'d4', type:'mc', q:`A Salesforce Flow uses the Start Docusign CLM Workflow action but the workflow never starts. Which is the most likely cause according to Docusign?`,
    choices:[`The Flow is record-triggered`, `The workflow name is misspelled or the workflow is inactive`, `The Record Id is an Opportunity`, `The workflow has a Finish step`],
    correct:1,
    explain:`Docusign: you must enter the exact name of an active CLM workflow. A misspelling or an inactive workflow means Salesforce cannot trigger it. The action also needs Apps Launcher 6.3 or higher.`},
  {id:'q39', domain:'d4', type:'mc', q:`With which smart rule event types is the Start Workflow action valid?`,
    choices:[`Document Events only`, `Folder Events only`, `Document Events and Scheduled Events`, `All event types`],
    correct:2,
    explain:`Start Workflow is valid with Document Events and Scheduled Events, and it requires a previously defined and published advanced workflow. Set Security is the one tied to Folder Events.`},
  {id:'q40', domain:'d4', type:'mc', q:`A workflow instance evaluates more than 300 expressions in a 15-minute window. What happens?`,
    choices:[`The instance fails and rolls back`, `The instance is paused and an email goes to the users in the Advanced Workflow Error Notification User setting`, `The extra expressions queue for the next window`, `The workflow is unpublished`],
    correct:1,
    explain:`Hitting the limit pauses the instance and notifies the Advanced Workflow Error Notification users. If no action is taken before the scheduled purge day, the workflow is aborted and purged.`},
  {id:'q41', domain:'d4', type:'mc', q:`What is the activity limit per workflow instance for revisions published after May 13, 2022 in Production?`,
    choices:[`1,000`, `5,000`, `10,000`, `100,000`],
    correct:2,
    explain:`10,000 activities per instance for new revisions; older revisions keep 100,000. Separately, 5,000 is the cap on consecutive activities without a human or asynchronous step, and 1,000 is how many executed steps the UI will show.`},

/* ============== EXAM + OPTIONAL TIMER ==============
   The real Pro exam has NO time limit. The timer is an optional pacing drill
   against Docusign's own ~50-minute estimate, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Pacing drill over. Exam submitted.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

    let cls = 'q-dot';
    if(state.submitted) cls += isCorrect(qq) ? ' ok' : ' no';
    else if(hasAnswer(qq)) cls += ' done';

  }).join('');

  let html = `
    <div class="exam-header">
      <div class="exam-header-row">
        <div class="exam-title-block">

        </div>
        ${(!state.submitted && state.timed && left!==null) ? `<span class="exam-timer${left<5*60000?' low':''}" id="examTimer">${fmtTime(left)}</span>` : ''}

  if(!state.submitted){
    if(q.type === 'ms' && hasAnswer(q)){
      primary = isLast

        : `<button class="btn btn-primary" onclick="gotoQ(${i+1})">Lock in &amp; continue →</button>`;
    } else if(isLast && answered > 0){
      primary = `<button class="btn btn-primary" onclick="submitExam()">Submit exam →</button>`;
    }
  }

  html += `
    <div class="q-nav">
