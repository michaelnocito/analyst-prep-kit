<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docusign CLM Implementation Pro Prep · Analyst Prep Kit</title>
<link rel="canonical" href="https://michaelnocito.github.io/analyst-prep-kit/docusign-clm-implementation-cert/">
<meta name="description" content="Prep for the Docusign CLM Implementation Pro exam. An area-by-area study guide of implementation planning, building workflows, the Salesforce integration and go-live, plus a 50-question practice exam graded against the real 80% pass mark.">

<style>
/* GRAIN design system. Same token re-pointing as the other cert kits. */
:root{--bg:var(--stone-900);--surf:var(--stone-800);--surf2:var(--stone-700);--surf3:var(--stone-600);--accent:var(--clay-400);--accdim:var(--clay-700);--text:var(--stone-50);--dim:var(--stone-300);--dim2:var(--stone-400);--border:var(--stone-700);--border2:var(--stone-600);--good:var(--leaf-400);--warn:var(--amber-300);--bad:var(--rust-400);--font:var(--font-sans);--mono:var(--font-mono);--r-sm:6px;--r-md:8px;--r-lg:12px}
[data-theme="light"]{--bg:var(--color-bg);--surf:var(--color-surface);--surf2:var(--stone-100);--surf3:var(--stone-200);--accent:var(--clay-500);--accdim:var(--clay-100);--text:var(--stone-900);--dim:var(--stone-600);--dim2:var(--stone-500);--border:var(--stone-200);--border2:var(--stone-300);--good:var(--leaf-500);--warn:var(--amber-600);--bad:var(--rust-500)}

/* Per-area colors: distinct, cream-readable hues from the Grain palette */
:root{--c-d1:#2A6E72;--c-d2:#97640C;--c-d3:#557A30;--c-d4:#BE3B22}

h1,h2,h3,h4,.nav-title,.cta-title,.study-title,.exam-title-block,.exam-mini-title{font-family:var(--font-display);letter-spacing:var(--tracking-tight)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;font-size:15px}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:var(--font);color:inherit}

nav{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:nowrap;overflow-x:auto}
.nav-btn{background:var(--surf2);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:var(--r-md);font-size:13px;transition:.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:var(--accent)}
.nav-btn .lucide{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
#themeIcon .lucide{width:15px;height:15px;vertical-align:-3px}
.nav-title{font-size:15px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.logo-mark{color:var(--accent);background:var(--surf2);width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;flex-shrink:0}
.logo-mark .lucide{width:17px;height:17px}
.cta-icon .lucide{width:28px;height:28px;color:var(--accent)}
.sv-cap .lucide{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.nav-spacer{flex:1}

main{max-width:780px;margin:0 auto;padding:32px 20px 80px}

/* HOME */
.hero{text-align:center;margin-bottom:36px}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(1.8rem,4.5vw,2.4rem);font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);font-size:15px;line-height:1.75;max-width:560px;margin:0 auto}

.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
@media(max-width:560px){.cta-row{grid-template-columns:1fr}}
.cta-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;cursor:pointer;text-align:left;transition:.15s;text-decoration:none;color:inherit;display:block}
.cta-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cta-card.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--surf),color-mix(in srgb,var(--accent) 6%,transparent))}
.cta-icon{font-size:28px;margin-bottom:10px}
.cta-title{font-size:17px;font-weight:700;margin-bottom:6px}
.cta-desc{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:12px}
.cta-link{font-size:13px;color:var(--accent);font-weight:600}

.method-callout{background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:13.5px;line-height:1.65;color:var(--dim);margin-bottom:28px}
.method-callout strong{color:var(--accent)}

/* Exam-facts card */
.facts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:28px}
.fact-chip{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:center}
.fact-chip .chip-num{font-size:18px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.fact-chip .chip-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.domain-weights{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dw-row{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px}
.dw-label{flex:1;font-size:13.5px;font-weight:600}
.dw-bar{flex:2;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.dw-fill{height:100%;border-radius:4px}
.dw-pct{font-size:13px;font-weight:700;font-family:var(--mono);min-width:38px;text-align:right}

/* STUDY GUIDE */
.study-intro{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.study-intro p{font-size:14.5px;line-height:1.7;color:var(--text);margin-bottom:8px}
.study-intro p:last-child{margin-bottom:0;color:var(--dim);font-size:13px}

.study-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden}
.study-head{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none}
.study-head:hover{background:var(--surf2)}
.study-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid currentColor;white-space:nowrap}
.study-title{flex:1;font-size:16px;font-weight:600}
.study-toggle{color:var(--dim);font-size:13px;transition:transform .15s}
.study-section.open .study-toggle{transform:rotate(90deg)}
.study-body{display:none;padding:0 22px 18px 22px;border-top:1px solid var(--border)}
.study-section.open .study-body{display:block}
.study-body ul{list-style:none;padding:0;margin:14px 0 0 0}
.study-body li{padding:8px 0 8px 22px;font-size:14px;line-height:1.6;color:var(--text);position:relative;border-bottom:1px dashed var(--border)}
.study-body li:last-child{border-bottom:none}
.study-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-size:13px;top:9px}
.study-body code{background:var(--surf2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.study-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent)}
.study-link:hover{text-decoration:underline}
.study-viz{background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:14px 0 2px}
.study-viz .sv-cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin-bottom:9px}
.study-viz em{color:var(--text);font-style:italic}
.miscon{margin-top:14px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--warn);border-radius:var(--r-md);font-size:13.5px;line-height:1.65}
.miscon strong{color:var(--warn)}

/* Concept confidence rater + needs-review filter (mirrors the kits' rater) */
.li-foot{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
.conf-chips{display:inline-flex;gap:5px}
.conf-chip{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--border);color:var(--dim);background:none;transition:.12s}
.conf-chip:hover{border-color:var(--accent);color:var(--text)}
.conf-chip.on.low{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.conf-chip.on.mid{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.conf-chip.on.high{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.hint-btn{font-size:12px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:12px;border:1px solid var(--border);color:var(--accent);background:none;cursor:pointer;transition:.12s}
.hint-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hint-resp{display:none;margin-top:9px;padding:11px 13px;background:var(--surf);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
.hint-resp.show{display:block}
.hint-key-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint-key-row input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.hint-key-row button{padding:8px 14px;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.hint-key-row button:hover{border-color:var(--accent);color:var(--accent)}
.expand-all.rf-on{border-color:var(--warn);color:var(--warn)}

.expand-all{font-size:13px;background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:var(--r-md);margin-bottom:16px}
.expand-all:hover{border-color:var(--accent);color:var(--text)}

/* EXAM */
.exam-header{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px;position:sticky;top:65px;z-index:50}
.exam-header-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.exam-title-block{flex:1}
.exam-mini-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.exam-q-progress{font-size:18px;font-weight:700}
.exam-q-progress span{color:var(--accent)}
.exam-timer{font-family:var(--mono);font-size:16px;font-weight:700;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf2)}
.exam-timer.low{color:var(--bad);border-color:var(--bad)}
.exam-submit-btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--r-md);font-size:14px;font-weight:600;white-space:nowrap}
.exam-submit-btn:hover{opacity:.9}
.exam-submit-btn:disabled{opacity:.45;cursor:not-allowed}
.exam-progress-bar{height:4px;background:var(--surf2);border-radius:2px;overflow:hidden}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--accdim),var(--accent));width:0;transition:width .3s}

.start-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;text-align:center;margin-bottom:20px}
.start-card h2{font-size:20px;margin-bottom:10px}
.start-card p{color:var(--dim);font-size:14px;line-height:1.7;max-width:520px;margin:0 auto 18px}
.start-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 14px 0;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.section-header:first-child{margin-top:0}
.section-header .section-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.section-header .section-name{font-size:15px;font-weight:600;color:var(--text)}

/* ONE-AT-A-TIME EXAM STEPPER */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.q-dot{width:22px;height:6px;border-radius:3px;border:none;padding:0;background:var(--surf2);cursor:pointer;transition:.15s}
.q-dot:hover{transform:scaleY(1.6)}
.q-dot.done{background:var(--accent)}
.q-dot.cur{background:var(--text);transform:scaleY(1.6)}
.q-dot.ok{background:var(--good)}
.q-dot.no{background:var(--bad)}
.q-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.q-nav .spacer{flex:1}
.lockin-hint{font-size:12.5px;color:var(--dim);margin-top:14px}
.q-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:var(--accent)}
.q-card.correct{border-color:var(--good);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--accent) 4%,transparent))}
.q-card.incorrect{border-color:var(--bad);background:linear-gradient(180deg,var(--surf),color-mix(in srgb,var(--bad) 4%,transparent))}
.q-num{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em;margin-bottom:6px}
.q-num .ms-tag{color:var(--accent);margin-left:8px}
.q-text{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text)}
.q-text code{background:var(--surf2);padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:13.5px;color:var(--accent);border:1px solid var(--border)}

.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 14px;font-size:14px;text-align:left;color:var(--text);transition:.15s;line-height:1.5;display:flex;gap:10px;align-items:flex-start;width:100%;overflow-wrap:anywhere}
.choice:hover{border-color:var(--accent)}
.choice.selected{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:var(--accent);color:var(--text)}
.choice.correct-answer{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--good);color:var(--text)}
.choice.wrong-answer{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad);color:var(--text)}
.choice-letter{font-weight:700;color:var(--dim);min-width:18px;font-family:var(--mono);font-size:13px;flex-shrink:0;margin-top:1px}
.choice.selected .choice-letter,.choice.correct-answer .choice-letter{color:var(--accent)}
.choice.wrong-answer .choice-letter{color:var(--bad)}
.choice-text{flex:1}

.explanation{display:none;margin-top:12px;padding:12px 14px;background:var(--surf2);border-left:3px solid var(--accent);border-radius:var(--r-md);font-size:13.5px;line-height:1.65;color:var(--text)}
.explanation.show{display:block}
.explanation strong{color:var(--accent)}

/* RESULTS */
.results-hero{text-align:center;margin-bottom:28px}
.results-eyebrow{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.score-big{font-size:64px;font-weight:800;line-height:1;color:var(--accent);margin-bottom:6px}
.score-big small{font-size:24px;font-weight:600;color:var(--dim)}
.score-verdict{font-size:18px;font-weight:600;margin-bottom:4px}
.score-sub{color:var(--dim);font-size:14px;line-height:1.6;max-width:520px;margin:0 auto}
.scaled-box{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surf);font-size:14px}
.scaled-box strong{font-family:var(--mono);font-size:18px}

.results-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.results-row{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px}
.results-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.results-pill{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor}
.results-section-name{font-weight:600;font-size:14px;color:var(--text)}
.results-score{font-size:14px;font-weight:600;font-family:var(--mono);color:var(--text)}
.results-bar{height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.results-bar-fill{height:100%;border-radius:3px;transition:width .8s ease-out}
.results-hint{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.55}
.results-hint a{color:var(--accent)}

.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.btn{padding:11px 22px;border-radius:var(--r-md);font-size:14px;font-weight:600;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost,.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover,.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FOOTER */
footer{margin-top:50px;padding-top:24px;border-top:1px solid var(--border);text-align:center;color:var(--dim);font-size:12px}
.footer-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-links a{color:var(--dim)}
.footer-links a:hover{color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;z-index:300}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:600px){
  .q-nav .btn{flex:1 1 100%;min-height:48px}
  .q-nav .spacer{display:none}
  .start-actions .btn{width:100%;min-height:48px}
}
</style>

<body>
<nav>
  <button class="nav-btn" onclick="window.location='../index.html'" title="Back to all kits">← All Kits</button>
  <span class="nav-title"><span class="logo-mark"><i data-lucide="badge-check"></i></span>Docusign CLM Implementation Pro Prep</span>
  <button class="nav-btn" id="navHome" onclick="setView('home')">Home</button>
  <button class="nav-btn" id="navStudy" onclick="setView('study')">Study Guide</button>

<main id="app"></main>

<script>
/* ============== STATE ============== */
const STORE = 'apk-dsclmimplcert';
const EXAM_MINUTES = 60;   // Docusign's own estimate. The real exam has NO time limit.
const state = JSON.parse(localStorage.getItem(STORE) || '{}');
state.answers = state.answers || {};
state.submitted = state.submitted || false;
state.openSections = state.openSections || {};
state.conf = state.conf || {};              // {conceptId: 'low'|'mid'|'high'}. Study-guide self-rating
state.reviewFilter = !!state.reviewFilter;
state.examStart = state.examStart || null;
state.timed = state.timed !== undefined ? state.timed : null;
state.view = location.hash ? (state.view || 'home') : 'home';
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* ============== HINTS ==============
   Same shared key as the other kits (localStorage 'apk-coach-key'). */
function getCoachKey(){ return localStorage.getItem('apk-coach-key') || ''; }
function setCoachKey(k){
  localStorage.setItem('apk-coach-key', k.trim());
  toast(k.trim() ? 'Key saved. Hints are on.' : 'Key cleared.');
  render();
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g,' ').trim();
}
async function hintCall(prompt, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  const key = getCoachKey();
  el.classList.add('show');
  if(!key){ el.textContent = 'Add your Anthropic API key on the home page under Hints to turn hints on.'; return; }
  el.textContent = 'Thinking…';
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:350,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if(!res.ok){ el.textContent = data?.error?.message || 'Request refused. Check your key.'; return; }
    el.textContent = data.content?.[0]?.text || 'No response. Check your key.';
  } catch(e){ el.textContent = 'Request failed. Check your key and your connection.'; }
}
const TUTOR_ROLE = `You are a plain-spoken Docusign CLM tutor helping someone study for the Docusign CLM Implementation Pro exam. That exam is about implementing Docusign CLM for a customer: planning and administering the account, designing folders and attributes, building workflows in Workflow Designer, integrating those workflows with Salesforce through Docusign Apps Launcher, and taking the solution live. It is about Docusign CLM, NOT CLM.CM (the older SpringCM platform).`;
function hintStudy(key, i){
  const s = STUDY.find(x=>x.key===key);
  if(!s) return;
  const fact = stripTags(s.must[i]);
  const prompt = `${TUTOR_ROLE}

Explain this exam point a different way than it is written here:
"${fact}"

Rules: 3 sentences at most. One idea per sentence. Use an everyday comparison if it helps. Say what the exam is likely to ask about it. No preamble, no restating the question.`;
  hintCall(prompt, 'hint-resp-' + key + '-' + i);
}
function hintQuestion(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  if(!q) return;
  const chosen = state.answers[qid];
  const picked = Array.isArray(chosen) ? chosen.map(i=>stripTags(q.choices[i])).join(' / ') : (chosen!==undefined ? stripTags(q.choices[chosen]) : '(no answer)');
  const right = q.type==='ms' ? q.correct.map(i=>stripTags(q.choices[i])).join(' / ') : stripTags(q.choices[q.correct]);
  const prompt = `${TUTOR_ROLE} A student got this practice question wrong.

Question: ${stripTags(q.q)}
They picked: ${picked}
Correct answer: ${right}

In 3 sentences at most, say what they were probably confusing, then give one plain rule that keeps the two apart. No preamble.`;
  hintCall(prompt, 'hint-resp-q-' + qid);
}

/* ============== STUDY GUIDE ============== */
const STUDY = [
  {key:'d1', title:'Implementation planning and administration',
    must:[
      `<strong>An implementation is a sequence, and the order is the exam point.</strong> You stand up the account and the org, then the folder structure, then attributes and document types, then groups and security, then workflows, then the Salesforce integration. Building a workflow before the attributes exist means rebuilding the workflow.`,
      `<strong>Two admin roles, and they are not the same person's job.</strong> The <em>organization administrator</em> creates the account, assigns the CLM Admin user, and enables the CLM application. The <em>CLM administrator</em> runs the CLM account itself. On a real project one person often holds both, but the exam separates them.`,
      `<strong>Users, groups and permission profiles live in Docusign Admin</strong> for Docusign CLM accounts, not inside the CLM application. CLM.CM is the platform that manages them in-app, and that is the distractor.`,
      `<strong>Design the folder structure around the two hard limits before you build it.</strong> A folder holds a maximum of <code>10,000</code> direct child objects, counting documents and subfolders together. The folder tree displays a maximum of <code>100</code> subfolders under any one folder.`,
      `<strong>Blowing the 10,000 limit hides everything.</strong> Not just the overflow: the product hides <em>all</em> objects in that folder and warns there are too many to display. Search still finds the contents, which is how a client first notices.`,
      `<strong>The recovery is a written one-time favour.</strong> An administrator asks Customer Support for a temporary exception. Docusign Engineering can lift the limit for a maximum of <strong>seven days</strong>. The request must name the root folder and the folder path, explain why you need it, explain how the structure grew to 10,000 objects, and say how you will stop it happening again. You must confirm in writing that you will not ask for another.`,
      `<strong>The 100-subfolder limit only affects the tree on the left of the Documents page.</strong> Hidden folders are still reachable by navigating the middle of the page. The usual culprits are automated creators: Salesforce mapping, smart rules and workflows. Design them to fan out, not to pile up.`,
      `<strong>Attributes are the metadata layer</strong>, and they carry their own ceilings: an attribute value holds <code>400</code> characters, an attribute name holds <code>50</code>, an attribute group name holds <code>50</code>. A CSV used to populate attribute values starts degrading performance past <code>10,000</code> rows.`,
      `<strong>Document types come in three categories</strong>: <em>standalone documents</em> (the primary agreements), <em>amendments</em> (they modify another document in the same agreement), and <em>supplements</em> (context, usually viewed and acknowledged rather than signed).`,
      `<strong>Learn the two short lists, not the long one.</strong> Amendments are only three by default: Addendum, Amendment, Change Order. Supplements are only four: Appendix, Exhibit, Attachment, Supplemental Document. Everything else in the default list is standalone.`,
      `<strong>You rename document types, you do not replace them.</strong> On <em>Document Types</em> under <em>Documents &amp; Folders</em>, select <em>Edit</em> and each type gets an <em>Alternate Name</em> and a <em>Visibility</em> setting. Two things the exam likes: <strong>party management must be enabled</strong> to use custom document types, and an alternate name does <strong>not</strong> change the type's classification.`,
      `<strong>Component packaging is how configuration moves between accounts</strong>, usually UAT to Production. Go to <em>Deployment</em> under <em>Account Management</em>, name the package, pick components on the tabs, choose a storage location, and save. The product writes a file with a <code>.spackage</code> extension.`,
      `<strong>Know the package option checkboxes.</strong> <em>Auto Install Package</em>, <em>Overwrite existing objects when installing package</em>, <em>Include account settings</em>, <em>Include account branding preferences</em>, and <em>Include account-level customization of navigation tabs, menus and toolbars</em>. On the Folders tab you can also tick <em>Include documents</em> and <em>Include group security</em>.`,
      `<strong>Installing the package is a document upload, not a menu item.</strong> You download the <code>.spackage</code> from the source account, upload it into a folder in the destination account, double-click the file name, wait for the deployment page, and select <em>Install</em>. An email tells you whether it worked.`,
      `<strong>Two rules on packages that get asked.</strong> You need at least <em>View and Edit</em> on the <code>.spackage</code> file to open it, and you must be a CLM administrator to install it. <strong>A package cannot be edited in the destination account</strong>; if it is wrong you build a new one in the source. You can reinstall the same package as many times as you like, which is also how you roll a component back.`,
      `<strong>Packaging is for components, not content.</strong> Folders and attribute groups are components. It is explicitly not a way to migrate a mass of documents. Bulk content moves by SFTP, and SFTP allows <code>20</code> concurrent connections.`,
      `<strong>Bulk metadata is a three-part build, and you do it in order.</strong> Create the attributes and attribute groups first, then an input data file (usually a CSV), then an <em>Attribute Import Mapping</em>, then a Document Rule that runs the <em>Import Bulk Metadata</em> action. It handles up to <strong>500 documents at a time</strong>, and every file must sit in the same folder.`,
      `<strong>The mapping has a shape you should recognise.</strong> On <em>Attribute Import Mappings</em> under <em>Documents &amp; Folders</em>, you set Type to <code>CSV</code>, set <em>Data Starts at Row</em> to <code>2</code> because row 1 is headers, and create one mapping element per column. Column 1 is the <em>Filename</em>, and every other element is written <code>Attribute Group.Attribute Field</code>.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Component packaging migrates the account." It does not. It transfers selected components, mostly configuration, from one CLM account to another. Documents ride along only if you tick <em>Include documents</em> on the Folders tab, and Docusign says plainly that packaging is not meant to migrate a mass amount of content. Content migration is a separate job, usually SFTP plus bulk metadata import.`,
    viz:`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px">
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Account &amp; org</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Folder structure</span>

      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)"><b style="color:var(--accent)">Attributes &amp; doc types</b></span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Groups &amp; security</span>
      <span style="color:var(--dim)">→</span>
      <span style="padding:4px 9px;border-radius:6px;background:var(--surf);border:1px solid var(--border)">Workflows</span>

  {key:'d2', title:'Building workflows',
    must:[
      `<strong>Workflows live under Admin.</strong> Select <em>Admin</em> in the navigation header, then <em>Workflows</em> under <em>Automation Tools</em>. The <em>Configuration</em> tab holds the designs; the main page holds the running activity.`,
      `<strong>The first design decision is made in the New Workflow dialog</strong>, which asks <em>What type of content will kick off this workflow?</em> and gives five answers: a document generation configuration, a document, custom XML, a folder, or <em>this workflow will start without content</em>. Pick the last one and your incoming content variable is empty, which is usually not what you wanted.`,
      `<strong>Custom XML is the sub-workflow answer.</strong> Docusign says outright that you can upload the XML from a parent workflow to build a sub-workflow. If a question describes a child process that needs the parent's data, the kickoff type is custom XML.`,
      `<strong>Building is not publishing.</strong> After you build or edit a design you must publish the version you are working on before it can run. On the toolbar, <em>Save your changes</em>, then <em>Create and publish versions</em>, then <em>Publish</em> for that version. The Versions and Publishing panel then shows it as <em>Published</em>. Saved but unpublished designs sit on the <em>Configuration</em> tab.`,
      `<strong>Two constraints people meet on day one.</strong> A workflow name is capped at <code>100</code> alphanumeric characters, and <strong>the workflow designer supports English only</strong>: the account's <em>Default Account Language</em> setting has to be English for the designer to work.`,
      `<strong>There are five categories of predefined step, and Docusign names them exactly this way</strong>: automated document management steps, human steps, engine steps, integration steps, and scheduling and communication steps. Most design questions are really "which category does this belong in".`,
      `<strong>Automated document management steps do what a person would otherwise do by hand</strong>: create documents from templates, create folders, apply security to documents and folders, copy and move documents, email documents, lock documents, assign document attributes, and search for documents and folders.`,
      `<strong>Human steps require a person, and they surface as workflow tasks on users' Task pages.</strong> Editing a document, approving one, choosing which documents or which people join the workflow, and filling in an electronic form are all human steps.`,
      `<strong>Engine steps build the logic.</strong> <em>Decision</em> routes on conditions, <em>Rule</em> examines a condition, <em>For Loop</em> and <em>For-Each Loop</em> iterate, <em>Convert Json to Xml</em> and <em>Create Variable from CSV</em> reshape data, <em>Get Next Autonumber Value</em> pulls the next auto number, <em>Logger</em> writes to the monitor, and <em>Resource Variable</em> loads a CLM user or group into an Actor variable.`,
      `<strong>The <em>Finish</em> step is not optional in practice.</strong> It tells the engine where the workflow successfully concludes, and <strong>it must be present and reached to resume a parent workflow that is waiting</strong>. A design with no Finish step that dies at an approval still reports as "Complete" in the activity monitor. Add Finish and the same failure reports as "Failure".`,
      `<strong>Integration steps are the outside world</strong>: <em>Add Salesforce Activity History</em>, <em>Add Salesforce Task</em>, <em>Create New Salesforce Object</em>, <em>Salesforce ETL</em>, <em>Connections</em> (purchased connectors to Netsuite Financials and Workday Financials), <em>Excel ETL</em>, <em>Http Client</em>, <em>Invoke Web Service</em>, and <em>Maestro Workflow</em>.`,
      `<strong>Scheduling and communication steps control timing and messages</strong>: <em>Email</em>, <em>Timer Trigger</em>, <em>Wait for Signal</em> (holds the path until a signal arrives through an API), <em>Update Information</em> (changes the text in the Info column on the Tasks and Workflow Activity pages), and <em>Group</em>, which is only a visual element for organising the canvas.`,
      `<strong>Every workflow has an incoming-content variable, named <code>Params</code> by default.</strong> It stores the information that triggered the workflow, and what is in it depends on how the workflow was started. Docusign is blunt about the rule: <strong>do not modify your Params content.</strong> Copy it to a new variable and manipulate that, so the original stays available for debugging.`,
      `<strong>Know the variable types by what they hold.</strong> A <em>Date</em> variable holds a date. An <em>ID List</em> variable holds the IDs of many documents or folders, which is how you store the output of a search step cheaply. An <em>Iterator</em> variable points at a repeating node inside another XML variable. An <em>Actor</em> variable holds users or groups.`,
      `<strong>Three families of variable, not one.</strong> Variables you create, <em>system</em> variables that capture data points about the workflow, and <em>caret</em> variables that capture workflow execution data. If a question asks where run-time execution data comes from, it is not a variable you built.`,
      `<strong>Docusign publishes a naming convention and the exam can lean on it.</strong> Use a succinct, meaningful, descriptive name, capitalise the first letter of every word, and use whole words rather than abbreviations. <code>EffectiveDate</code>, not <code>effdt</code>.`,
      `<strong><em>Create Variable from CSV</em> carries three limits worth memorising.</strong> The uploaded CSV cannot exceed <code>1 MB</code>, the variable it creates cannot exceed <code>5 MB</code>, and the file must sit in a Docusign CLM folder with at least two columns and a header row. It is usually paired with a loop that applies attributes or creates folders.`,
      `<strong><em>Http Client</em> is the generic outbound call, and it is HTTPS only.</strong> Docusign supports protocol versions 1.0 and 1.1. You must give it a response variable and a response status code variable, and it exposes <em>Success</em> and <em>Failure</em> outputs so you can route errors instead of stalling.`,
      `<strong>Error handling is designed in, not bolted on.</strong> Steps expose last-action output conditions such as <em>Success</em>, <em>Failure</em> and <em>Timed Out</em>, and connectors are configured through the <em>Follow this link if last action output is</em> dropdown. Leave the Failure line unconnected and the workflow stops silently, which is exactly the scenario the exam describes.`,
      `<strong>The Start step carries the error notification switch.</strong> <em>Send a notification when workflow encounters an error</em> is a checkbox on Start, with a <em>Users To Receive Notification</em> picklist next to it. Separately, the account-level <em>Advanced Workflow Error Notification User</em> setting is who gets emailed when an instance is paused for hitting the expression limit. Two different notifications, and an implementation should set both.`,
      `<strong>Parent and child talk through two named steps.</strong> <em>Set Workflow Output</em> passes a child workflow's output back to the parent, and <em>Update Parent Variable</em> writes into the parent's variable. The process name only needs setting in the parent; sub-workflows are recognised as part of the same overall process.`,
      `<strong>Expressions are C#, and the namespaces are allowlisted.</strong> The Expression Builder constructs and validates them, and only namespaces on Docusign's published allowlist may be used. On dates, Docusign says use <em>Current Date</em>, which follows the account time zone, rather than <code>DateTime.Now</code>, which follows the machine's.`,
      `<strong>Signature work is a step, not a separate product.</strong> <em>Wait for Signature</em> and the human <em>Review and Send for Signature</em> step send documents to eSignature from inside the workflow, and CLM caps each document or envelope it sends at <code>25 MB</code>, or <code>100 MB</code> if chunked upload is enabled for the account.`,
      `<strong>Variable sizing has three separate ceilings.</strong> One variable may reach <code>5 MB</code>, all the variables in a single workflow may total <code>25 MB</code>, and a variable name is capped at <code>250</code> alphanumeric characters. Stuffing whole documents into XML variables is how implementations hit these.`,
      `<strong>A business day is eight hours, not twenty-four.</strong> That is how CLM calculates due dates and reminders, so a step configured for "1 day" of 24 hours resolves to three business days. Clients read that as a bug; it is documented behaviour.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "If the workflow finished, it worked." Not without a <em>Finish</em> step. Docusign gives the exact scenario: a workflow with no Finish step that stops at an approval step because of a failure still shows as <strong>Complete</strong> in the workflow activity monitor. Put Finish on the canvas and that same run shows as <strong>Failure</strong>. Every design you hand a client needs one, and a sub-workflow needs one before its parent will ever resume.`,
    viz:`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Automated document management</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Human</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Engine</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Integration</b></span>
      <span style="padding:3px 9px;border-radius:4px;background:var(--surf);border:1px solid var(--border);font-size:12px"><b>Scheduling and communication</b></span>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">The five step categories, in Docusign's own words. Place a step in the wrong one and the question gets easy for someone else.</div>`},

  {key:'d3', title:'Salesforce integration',
    must:[
      `<strong>There is no standalone CLM package.</strong> The managed package is <strong>Docusign Apps Launcher</strong>, and it is unified: installing any one app installs all of them. It contains CLM for Salesforce, CLM Essentials for Salesforce, Gen for Salesforce, eSignature for Salesforce, and the eSignature for Salesforce Apex Toolkit.`,
      `<strong>Install with production credentials even into a sandbox.</strong> Apps Launcher comes from AppExchange, and you use production Salesforce administrator credentials for the install, which trips people up on their first sandbox build.`,
      `<strong>Do not confuse it with the legacy app.</strong> <em>Docusign Document Management</em>, formerly known as SpringCM File It, is the old CLM app. <em>Docusign CLM</em> is the current one inside Apps Launcher. Instructions differ, and the legacy name is a favourite distractor.`,
      `<strong>The connection is made on the Docusign Setup page</strong>, using both Docusign and Salesforce administrator credentials. The connecting Salesforce user becomes the <strong>integration user</strong>, and that account is the one every later call runs as.`,
      `<strong>Two hard requirements on the integration user.</strong> It must have Salesforce System Administrator access, and its Salesforce profile must have <strong><em>Enable MFA for API logins</em> set to False</strong>. That second one is the single most-asked integration setting.`,
      `<strong>Docusign recommends a generic integration user</strong>, something like <code>docusign-admin@company.com</code> that no human logs in with. A named employee as the integration user means the whole integration breaks when they leave.`,
      `<strong>One Salesforce organization per Docusign account.</strong> Docusign does not support connecting multiple Salesforce organizations to a single Docusign account. If a client asks, the answer is no, not "configure it carefully".`,
      `<strong>If a full admin is not allowed, you clone a profile instead.</strong> Name it <em>Docusign Integration User</em> and grant <em>Manage Users</em>, <em>API Enabled</em>, <em>View Setup and Configuration</em>, <em>Modify Metadata Through Metadata API Functions</em>, <em>Customize Application</em> and <em>Manage Custom Permissions</em>, plus <em>View All</em> on every object Apps Launcher must read.`,
      `<strong>Two objects are mapped for you.</strong> When you connect the Salesforce organization to the CLM account, Docusign maps <strong>Account</strong> and <strong>Opportunity</strong> automatically. Every other standard or custom object is a manual mapping.`,
      `<strong>The mapping route is a Salesforce route, not a CLM one.</strong> App Launcher, then <em>Docusign Apps Launcher</em>, then <em>Integration</em> in the left column, then <em>MAP NEW</em>, then the <em>Select Object</em>, <em>Search Object</em> and <em>Search Fields</em> tabs, then <em>Confirm</em>.`,
      `<strong>Name mapped folders from fields, and always include the ID.</strong> CLM does not permit duplicate folder names, so mapping both the name and the record ID keeps names unique. Mapping the ID also means CLM folder names update when the Salesforce record is renamed. Keep the folder location Docusign assigns.`,
      `<strong>Opening a record creates the folder.</strong> When a user opens a record from a mapped object, Docusign creates the folder in CLM, and it appears in that record's <strong>Docusign CLM Files</strong> component. Folders are created on demand, not in a bulk pre-build.`,
      `<strong>Mapped folder paths are capped at <code>240</code> characters</strong>, counting the mapped object's name and every folder above it. CLM silently removes anything past the limit, which produces duplicate folder names when the unique part of the path sits at the end. Put the distinguishing value early.`,
      `<strong>Mapped folder names get characters swapped for underscores.</strong> The list is <code># &amp; * | \\ : ? &lt; &gt; /</code> plus tab, <code>+</code>, <code>-</code> and <code>%</code>. Account names with an ampersand are the usual surprise.`,
      `<strong>Salesforce mapping is an automated folder creator</strong>, so the folder limits are your problem: <code>10,000</code> direct child objects per folder and <code>100</code> subfolders shown in the tree. The documented fix is to split with subfolders, for example an Account directory broken up by the first letter of the account name.`,
      `<strong>Three documented ways to start a CLM workflow from Salesforce.</strong> A <em>Start Docusign CLM Workflow</em> action inside a Salesforce Flow, a CLM Files <em>custom action</em> set to <em>Start workflow</em>, and a custom button on a page layout.`,
      `<strong>The Flow action has two gotchas.</strong> It needs <strong>Docusign Apps Launcher v6.3 or higher</strong>, and its <em>Workflow Name</em> input must be the exact name of an <strong>active</strong> CLM workflow. Misspell it or point at an inactive one and Salesforce cannot trigger it. Its other input is <em>Record Id</em>.`,
      `<strong>Custom actions are built in CLM, not Salesforce.</strong> Go to <em>Admin</em>, then <em>Navigation &amp; Actions</em>, then <em>CLM Files Actions</em>, then <em>Custom Actions</em>, then <em>New Action</em>, and set <em>What should this action do?</em> to <em>Start workflow</em>. You can tick <em>Pass selected items with this action</em> to send document IDs and <em>Pass user information with this action</em> to send the triggering user.`,
      `<strong>Five Salesforce steps live inside CLM workflows.</strong> <em>Salesforce ETL</em> reads real-time data out of Salesforce. <em>Update Salesforce</em> writes field values back. <em>Create New Salesforce Object</em> creates a record. <em>Add Salesforce Activity History</em> and <em>Add Salesforce Task</em> log the activity.`,
      `<strong>Salesforce ETL is the answer to "the data changed after the workflow started".</strong> It retrieves current values, so a workflow that started at Opportunity creation can still read a status or date entered later. Both it and <em>Update Salesforce</em> are modelled on SOQL.`,
      `<strong>Security mapping maps a profile to a group.</strong> In CLM go to <em>Admin</em>, then <em>Connections</em>, then <em>Salesforce</em>, then <em>Create New Mapping</em>, and pair a Salesforce Profile with one or more Docusign CLM Groups. Salesforce users in that profile then get the CLM group's rights to content.`,
      `<strong>Federated Security is the heavier option.</strong> It applies Salesforce <em>Profile</em> or <em>Role</em> security to all CLM content, configured on the CLM Admin page, so security stays managed in Salesforce. It <strong>cannot be applied to CLM reports</strong>, because reports run in the CLM account.`,
      `<strong>Two warnings on Federated Security you must be able to recite.</strong> Do not refresh a Salesforce organization while it is applied, and do not connect that organization to a different CLM account. Docusign's words: failure to follow the prescribed steps destroys all CLM file security and you must rebuild the entire CLM directory.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Mapping a Salesforce object copies its data into CLM." It does not. Mapping creates a path: when a user opens a record from a mapped object, CLM builds a folder for it, and that folder shows up in the record's Docusign CLM Files component. Getting live field values into a running workflow is a different tool, the <em>Salesforce ETL</em> step, and pushing values back is <em>Update Salesforce</em>. Mapping is where documents live; ETL is how data moves.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Object mapping</b> <span style="color:var(--dim);font-size:13px">where the folder goes</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Security mapping</b> <span style="color:var(--dim);font-size:13px">profile to CLM group</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Salesforce ETL</b> <span style="color:var(--dim);font-size:13px">data in</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Update Salesforce</b> <span style="color:var(--dim);font-size:13px">data back out</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Four separate jobs. A question naming one of them is never really asking about another.</div>`},

  {key:'d4', title:'Advanced workflows and go-live',
    must:[
      `<strong>A workflow instance may evaluate <code>300</code> expressions in any 15-minute period.</strong> This is a published service limit, and it is the single number most likely to appear. It is per instance, not per account.`,
      `<strong>The limit is new, and the dates are part of the fact.</strong> It applies to new workflow revisions created on or after <strong>12 August 2025</strong> in UAT environments, and on or after <strong>2 September 2025</strong> in Production. An older revision that you never republish is not affected.`,
      `<strong>Know exactly what happens when it trips.</strong> The product pauses the workflow instance and emails the users named in the account's <em>Advanced Workflow Error Notification User</em> setting. If nobody acts before the scheduled purge day, the product aborts and purges the workflow. Nothing restarts on its own.`,
      `<strong>There are three more workflow ceilings next to it.</strong> A workflow instance may execute <code>10,000</code> activities in total, <code>5,000</code> of them consecutively without a human or asynchronous step, and the output of a single expression evaluation is capped at <code>1 MB</code>.`,
      `<strong>Exceeding the activity limit pauses too, and assigns a purge date.</strong> You can see the count under <em>Total Activities Executed</em> on the Workflow Information panel after opening a workflow from the Workflows page. Support can raise the limit for a paused workflow so you can resume it.`,
      `<strong>UAT is deliberately smaller than Production, and the exam can use that.</strong> Workflows started per hour: <code>100</code> in UAT against <code>1,000</code> in Production. Workflow executions: <code>500</code> every 15 minutes in UAT against <code>12,000</code> in Production. A load test that passes in UAT proves less than the client thinks.`,
      `<strong>Long-running workflows expire.</strong> An instance may sit in Executing or Paused for <code>365</code> days in Production and <code>90</code> days in UAT. Purging begins 30 days after a system pause, and completed or failed workflows purge between 7 and 30 days.`,
      `<strong>Design around the limit rather than asking for more.</strong> Move repetitive expression work into sub-workflows, cut expressions inside loops, and push data shaping into XML or a document generation step instead of chaining expressions.`,
      `<strong>Three things start a workflow, and they are not interchangeable.</strong> A person starts one manually. A <em>smart rule</em> starts one when something happens. A <em>schedule</em> starts one when a time arrives. Salesforce and the API are the fourth and fifth routes, and they are the ones an implementation usually ends up wiring.`,
      `<strong>Smart rules are event-driven and come in three shapes</strong>: document smart rules (triggered by document activity), folder smart rules (triggered by folder activity), and scheduled smart rules. <em>Chained</em> is a fourth entry in the list but it is not an event; it means the rule is called by another rule.`,
      `<strong>Document events worth knowing by name</strong>: <em>Document Added</em> fires when a document is first added or uploaded. <em>Document Entered Folder</em> fires when a document is copied, moved <em>or</em> uploaded. <em>Document Checked In</em> fires when a new version is uploaded. <em>Attribute Group Assigned</em> fires when a previously defined attribute group is applied.`,
      `<strong>Document events run for any document</strong>, so Docusign tells administrators to use <strong>filters</strong> to limit the scope of document and folder rules. An unfiltered rule on a busy folder is the classic implementation mistake.`,
      `<strong>A triggered smart rule is not an instant smart rule.</strong> Rules queue, and a rule whose action is starting a workflow can be deferred if the account has reached its allowed workflow limit. Never design a process that assumes the rule fires the same second as the event.`,
      `<strong>Schedules come in exactly two kinds.</strong> An <em>explicit</em> schedule names specific dates and times. A <em>recurring</em> schedule specifies a day and time relative to the hour, week or month.`,
      `<strong>What a scheduled smart rule can do</strong>: send an email, start a workflow, send a custom report, or move one or more documents to the trash. That last one is how you build automated retention.`,
      `<strong>Say it out loud</strong>: "A smart rule waits for something to happen. A schedule waits for a time to arrive. A workflow runs the process once one of them pulls the trigger."`,
      `<strong>Test in UAT, promote by package.</strong> The implementation pattern is build and test in a UAT account, package the components, install into Production, then reinstall the package if you need to restore the originals. Nothing about a workflow gets hand-rebuilt in Production.`,
      `<strong>Content migration is its own workstream.</strong> Load documents in bulk with SFTP into a single folder, then apply metadata with an Attribute Import Mapping and an <em>Import Bulk Metadata</em> document rule, <code>500</code> documents at a time.`,
      `<strong>Two go-live numbers people forget.</strong> A report exported to CSV stops at <code>5,000</code> records, so a migration reconciliation report bigger than that must be saved to a CLM folder first, then exported. And a file over <code>268 MB</code> cannot be indexed, so it will never appear in search no matter how clean the metadata is.`,
      `<strong>Adoption is a design problem, not a training problem.</strong> Personas change which menus, toolbar buttons and navigation options a user sees, so shaping the screen for each department is part of the implementation, not an afterthought.`
    ],
    miscon:`<strong>Misconception to bust:</strong> "Hitting the 300-expression limit is an account problem, so raise the account limit." The limit is per workflow instance in a 15-minute window, and it is not a dial an administrator turns. The fix is design: fewer expressions in loops, work pushed into sub-workflows, and data shaped in XML rather than assembled expression by expression.`,
    viz:`<div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Smart rule</b> <span style="color:var(--dim);font-size:13px">an event happened</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Schedule</b> <span style="color:var(--dim);font-size:13px">a time arrived</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>Salesforce</b> <span style="color:var(--dim);font-size:13px">a record changed</span></div>
      <div style="border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surf)"><b>A person</b> <span style="color:var(--dim);font-size:13px">pressed start</span></div>
    </div><div style="color:var(--dim);font-size:12px;margin-top:7px">Four ways in. The workflow itself does not care which one fired it.</div>`}
];

/* ============== PRACTICE EXAM: 50 questions ==============
   d1: 12 · d2: 15 · d3: 15 · d4: 8
   The real exam is 50 multiple-choice items at 80% to pass, with no time limit.
   type 'mc' → correct: index · type 'ms' → correct: [indices] (choose all that apply) */
const QUESTIONS = [
  /* ---------- AREA 1 · Implementation planning and administration (12) ---------- */
  {id:'q1', domain:'d1', type:'mc', q:`A client's Accounts folder has grown past 10,000 direct child objects. What does a user see when they open it?`,
    choices:[`Only the first 10,000 objects, sorted by name`, `No objects at all, plus a warning that there are too many items to display`, `The folder opens normally but new uploads are blocked`, `The oldest documents are moved to the trash automatically`],
    correct:1,
    explain:`Once the limit is exceeded the product hides <strong>all</strong> objects in that folder and warns there are too many to display. It is not a partial view. Search still finds the contents, which is usually how the client notices something is wrong.`},
  {id:'q2', domain:'d1', type:'mc', q:`For how long can Docusign Engineering lift the 10,000-object folder limit as a temporary exception?`,
    choices:[`24 hours`, `Seven days`, `Thirty days`, `Until the folder is reorganised, with no fixed end date`],
    correct:1,
    explain:`A maximum of <strong>seven days</strong>. An administrator must request it from Customer Support, name the root folder and path, explain how the folder grew and how they will prevent a repeat, and agree in writing that they will not request another exception.`},
  {id:'q3', domain:'d1', type:'ms', q:`Which statements about component packaging in Docusign CLM are true? <em>Choose all that apply.</em>`,
    choices:[`It is designed to move configuration components between accounts, such as UAT to Production`, `It is the supported way to migrate a large volume of documents into a new account`, `The package is saved as a file with a .spackage extension`, `A package cannot be edited in the destination account`],
    correct:[0,2,3],
    explain:`Packaging moves components, saves a <code>.spackage</code> file, and cannot be edited at the destination. Docusign states plainly that it is <strong>not</strong> meant to migrate a mass amount of content such as documents. Bulk content moves by SFTP.`},
  {id:'q4', domain:'d1', type:'mc', q:`Where do you build a component package in Docusign CLM?`,
    choices:[`Deployment, under Account Management`, `Integrations, under Connections`, `Attribute Import Mappings, under Documents &amp; Folders`, `The Configuration tab of the Workflows page`],
    correct:0,
    explain:`Select <em>Admin</em>, then <em>Deployment</em> under <em>Account Management</em>. You name the package, choose the option checkboxes, pick components on the tabs, choose a storage location, and save.`},
  {id:'q5', domain:'d1', type:'mc', q:`How is a component package installed in the destination CLM account?`,
    choices:[`It is emailed to Docusign Support, who install it`, `It is uploaded as a document into a folder, then opened and installed`, `It is pasted into the Deployment page as XML`, `It installs automatically when the destination account is created`],
    correct:1,
    explain:`You download the <code>.spackage</code> from the source account, upload it to a folder in the destination account through <em>File &gt; Upload</em>, double-click the file name, wait for the deployment page, then select <em>Install</em>. An email reports success or errors.`},
  {id:'q6', domain:'d1', type:'mc', q:`A component you transferred was changed by mistake in Production. What is the supported way to restore it?`,
    choices:[`Edit the package in the destination account and reapply it`, `Install the same package again`, `Rebuild the component by hand and document the change`, `Request a rollback from Docusign Support`],
    correct:1,
    explain:`You can install the package as many times as needed, and reinstalling restores the original package contents. Editing the package in the destination account is not possible; if the package itself is wrong you build a new one in the source account.`},
  {id:'q7', domain:'d1', type:'ms', q:`Which items are options you can tick when creating a component package? <em>Choose all that apply.</em>`,
    choices:[`Auto Install Package`, `Overwrite existing objects when installing package`, `Include account branding preferences`, `Include workflow activity history`],
    correct:[0,1,2],
    explain:`The package options are Auto Install Package, Overwrite existing objects when installing package, Include account settings, Include account branding preferences, and Include account-level customization of navigation tabs, menus and toolbars. Workflow activity history is not a packageable option.`},
  {id:'q8', domain:'d1', type:'mc', q:`How many documents can the Import Bulk Metadata action process at one time?`,
    choices:[`50`, `500`, `5,000`, `10,000`],
    correct:1,
    explain:`Up to <strong>500 documents</strong> at a time. Every file must be in the same folder, because the action is not designed to apply attributes across multiple folders. It is a common step during migration from a legacy system.`},
  {id:'q9', domain:'d1', type:'ms', q:`Building an Attribute Import Mapping for a CSV, which of these are correct? <em>Choose all that apply.</em>`,
    choices:[`Set Type to CSV`, `Set Data Starts at Row to 2 because row 1 holds the headers`, `Assign the Filename option to column 1`, `Attribute fields are entered as Attribute Field only, with no group prefix`],
    correct:[0,1,2],
    explain:`Type is CSV, Data Starts at Row is 2, and column 1 is the Filename. Attribute fields are formatted <code>Attribute Group.Attribute Field</code>, so the group prefix is required, not optional.`},
  {id:'q10', domain:'d1', type:'mc', q:`Which document types are classified as amendments by default?`,

  {id:'q11', domain:'d1', type:'ms', q:`A client wants "Vendor Contract" to appear instead of "Master Service Agreement". What is true about doing this? <em>Choose all that apply.</em>`,
    choices:[`You add an Alternate Name on the Document Types page under Documents &amp; Folders`, `Party management must be enabled to use custom document types`, `The document type's classification changes to match the new name`, `Documents that already exist in CLM will display the new name`],
    correct:[0,1,3],
    explain:`An alternate name is a display change. It applies to existing documents and requires party management to be enabled, but it does <strong>not</strong> change the type's classification. Master Service Agreement stays a standalone document no matter what you call it.`},
  {id:'q12', domain:'d1', type:'mc', q:`Where are users, groups and permission profiles managed for a Docusign CLM account?`,

    correct:0,
    explain:`For Docusign CLM accounts, users, groups and permission profiles are managed in <strong>Docusign Admin</strong>. CLM.CM is the platform that manages them inside the application, and that is the distractor the exam uses.`},

  /* ---------- AREA 2 · Building workflows (15) ---------- */
  {id:'q13', domain:'d2', type:'mc', q:`You are building a child workflow that must receive data from its parent. Which kickoff content type do you choose in the New Workflow dialog?`,
    choices:[`A document`, `A folder`, `Custom XML`, `This workflow will start without content`],
    correct:2,
    explain:`Custom XML. Docusign states that you can upload the XML from a parent workflow to build a sub-workflow. Choosing "start without content" leaves your incoming content variable empty, which is the classic wrong answer here.`},
  {id:'q14', domain:'d2', type:'ms', q:`Which of these are categories of predefined workflow step in Docusign CLM? <em>Choose all that apply.</em>`,
    choices:[`Automated document management steps`, `Engine steps`, `Scheduling and communication steps`, `Reporting and analytics steps`],
    correct:[0,1,2],
    explain:`The five categories are automated document management, human, engine, integration, and scheduling and communication. There is no reporting and analytics category.`},
  {id:'q15', domain:'d2', type:'mc', q:`A workflow with no Finish step stops at an approval because of a failure. How does it appear in the workflow activity monitor?`,
    choices:[`Failure`, `Paused`, `Complete`, `Aborted`],
    correct:2,
    explain:`It shows as <strong>Complete</strong>, which is exactly why the Finish step matters. Add a Finish step to the canvas and the same run is reported as Failure. Finish also has to be reached before a waiting parent workflow will resume.`},
  {id:'q16', domain:'d2', type:'mc', q:`Which step passes a child workflow's output back to its parent?`,
    choices:[`Update Parent Variable`, `Set Workflow Output`, `Logger`, `Resource Variable`],
    correct:1,
    explain:`<em>Set Workflow Output</em> passes child workflow output to the parent. <em>Update Parent Variable</em> writes directly into a parent variable, which is a different job. <em>Resource Variable</em> loads a CLM user or group into an Actor variable.`},
  {id:'q17', domain:'d2', type:'mc', q:`What is the documented rule about the Params variable?`,
    choices:[`Rename it to Incoming before use`, `Do not modify its content; copy it to a new variable if you need to manipulate the data`, `Clear it once the first step completes to save space`, `It must be recreated manually for every workflow`],

    explain:`Params holds whatever triggered the workflow. Docusign says do not modify it, because retaining the exact triggering data helps with debugging. If you need to change the data, copy it into a new variable and work there. The name can be changed, but the content should not be.`},
  {id:'q18', domain:'d2', type:'mc', q:`Which variable type is best for storing the output of a Find Documents by Folder step when you only need the identifiers?`,
    choices:[`Custom XML variable`, `ID List variable`, `Iterator variable`, `Actor variable`],
    correct:1,
    explain:`An <em>ID List</em> variable stores the IDs of multiple documents or folders. It is designed for search step output and keeps the variable small because it holds only IDs.`},
  {id:'q19', domain:'d2', type:'ms', q:`Which limits apply to the Create Variable from CSV step? <em>Choose all that apply.</em>`,
    choices:[`The uploaded CSV cannot exceed 1 MB`, `The variable it creates cannot exceed 5 MB`, `The CSV must contain at least two columns with a header row`, `The CSV must be uploaded from the local machine each run`],

  {id:'q20', domain:'d2', type:'mc', q:`Which step makes outbound HTTPS calls from a CLM workflow?`,

    explain:`<em>Http Client</em> makes outbound HTTPS or REST calls and supports only HTTPS protocol versions 1.0 and 1.1. <em>Invoke Web Service</em> calls a configured web service from the Web Service List, which is a different setup.`},
  {id:'q21', domain:'d2', type:'mc', q:`A workflow step is configured with a due date of "1 day" meaning 24 hours. How many business days does CLM calculate?`,
    choices:[`One`, `Two`, `Three`, `It depends on the account time zone`],

  {id:'q22', domain:'d2', type:'ms', q:`Which of these are true about publishing a CLM workflow? <em>Choose all that apply.</em>`,
    choices:[`Saving a design is enough to make it executable`, `You use the Create and publish versions toolbar button`, `The Versions and Publishing panel shows the version as Published`, `Unpublished designs appear on the Configuration tab of the Workflows page`],

    explain:`Saving is not publishing. You save, then use <em>Create and publish versions</em>, then select <em>Publish</em> for that version, and the panel shows a Published status. Saved but unpublished designs sit on the Configuration tab.`},
  {id:'q23', domain:'d2', type:'mc', q:`A client's account has Default Account Language set to French. What is the effect on workflow building?`,

    correct:1,

  {id:'q24', domain:'d2', type:'mc', q:`Expressions in Docusign CLM workflows are written in which language?`,

    explain:`CLM workflow expressions are C#, built and validated in the Expression Builder. Only namespaces on Docusign's published allowlist may be used, so not every C# library is available to you.`},
  {id:'q25', domain:'d2', type:'mc', q:`Docusign recommends using Current Date rather than DateTime.Now in a workflow expression. Why?`,

  {id:'q26', domain:'d2', type:'ms', q:`Which of these are engine workflow steps? <em>Choose all that apply.</em>`,

  {id:'q27', domain:'d2', type:'mc', q:`Where do you switch on the notification that fires when a workflow encounters an error?`,

  {id:'q33', domain:'d3', type:'mc', q:`Why does Docusign recommend mapping both the record name and the record ID when naming mapped folders?`,

  {id:'q34', domain:'d3', type:'mc', q:`An account is named "Smith &amp; Sons". What happens to the ampersand in the mapped CLM folder name?`,

/* ============== VIEW ROUTING ============== */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('nav .nav-btn').forEach(b=>b.classList.remove('active'));
  const navId = 'nav' + state.view.charAt(0).toUpperCase() + state.view.slice(1);
  document.getElementById(navId)?.classList.add('active');
  document.getElementById('navResults').style.display = state.submitted ? '' : 'none';

  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'study') app.innerHTML = renderStudy();
  else if(state.view === 'exam') app.innerHTML = renderExam();
  else if(state.view === 'results') app.innerHTML = renderResults();
  attachFooter(app);
  if(typeof grainRefreshIcons === 'function') grainRefreshIcons();
  syncTimerLoop();
}

function setView(v, opts){
  if(v === 'results' && !state.submitted){ toast('Finish and submit the exam to see results.'); return; }
  state.view = v;
  save();
  render();
  if(opts && opts.scrollToSection){
    const el = document.getElementById('study-' + opts.scrollToSection);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Deep-link routing: #study, #study-d1..d4, #exam, #home, #results, #review */
function handleHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return;
  if(h === 'study'){ setView('study'); return; }
  if(h.startsWith('study-')){
    const key = h.slice('study-'.length);
    if(DOMAIN_INFO[key]){
      state.openSections[key] = true;
      save();
      setView('study', {scrollToSection: key});
    }
    return;
  }
  if(h === 'exam') setView('exam');
  else if(h === 'review') openReview();
  else if(h === 'home') setView('home');
  else if(h === 'results' && state.submitted) setView('results');
}
window.addEventListener('hashchange', handleHash);

/* ============== EXAM + OPTIONAL TIMER ==============
   The real Pro exam has NO time limit. The timer is an optional pacing drill
   against Docusign's own ~50-minute estimate, never the default. */
function timeLeftMs(){
  if(!state.timed || !state.examStart) return null;
  return Math.max(0, state.examStart + EXAM_MINUTES*60000 - Date.now());
}
function fmtTime(ms){
  const s = Math.ceil(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}
let timerInterval = null;
function syncTimerLoop(){
  clearInterval(timerInterval);
  if(state.view !== 'exam' || state.submitted || !state.timed || !state.examStart) return;
  timerInterval = setInterval(()=>{
    const left = timeLeftMs();
    const el = document.getElementById('examTimer');
    if(el){
      el.textContent = fmtTime(left);
      el.classList.toggle('low', left < 5*60000);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      toast("Pacing drill over. Exam submitted.");
      submitExam(true);
    }
  }, 500);
}

function startExam(timed){
  state.timed = timed;
  state.examStart = Date.now();
  state.qIdx = 0;
  save();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
